<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brilha Goiânia — Monitoramento</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d16;--bg2:#0c101b;--bg3:#101525;--bg4:#161d2e;
  --border:#1e2a3a;
  --primary:#ca9d4a;--primary-dim:rgba(202,157,74,0.12);--primary-glow:rgba(202,157,74,0.4);
  --accent:#fec463;--accent2:#9a6e31;
  --green:#00e676;--red:#ff3d57;--yellow:#ffc400;--purple:#a78bfa;
  --text:#e7e9ec;--text-dim:#8a94a8;--text-muted:#3d4d66;
  --gold-grad:linear-gradient(135deg,#9a6e31,#fec463,#ca9d4a);
  --gold-grad2:linear-gradient(90deg,#9a6e31,#fec463);
  --sidebar:230px;--topbar:58px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;overflow:hidden;}
.app{display:flex;height:100vh;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid rgba(202,157,74,.15);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:200;}
.sidebar::after{content:'';position:absolute;right:-1px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--accent),transparent);opacity:.4;}
.sb-logo{height:var(--topbar);padding:0 16px;border-bottom:1px solid rgba(202,157,74,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(202,157,74,.03);}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto;}
.sb-sec{padding:8px 16px 4px;font-size:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:2px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 16px;cursor:pointer;transition:all .2s;color:var(--text-dim);border-left:3px solid transparent;font-size:13px;font-weight:400;letter-spacing:.2px;user-select:none;}
.nav-item:hover{background:rgba(202,157,74,.07);color:var(--text);}
.nav-item.active{background:rgba(202,157,74,.1);color:var(--accent);border-left-color:var(--accent);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;}
.sb-user{padding:12px 16px;border-top:1px solid rgba(202,157,74,.15);display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:var(--gold-grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#0a0d16;}
.uinfo{flex:1;min-width:0;}
.uname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urole{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:4px;transition:color .2s;display:flex;}
.icon-btn:hover{color:var(--red);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--bg2);border-bottom:1px solid rgba(202,157,74,.2);height:var(--topbar);padding:0 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-family:'Roboto',sans-serif;font-weight:500;font-size:16px;letter-spacing:.5px;background:var(--gold-grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.view-toggle{display:flex;background:var(--bg3);border:1px solid rgba(202,157,74,.2);border-radius:6px;overflow:hidden;}
.vt-btn{padding:5px 11px;border:none;cursor:pointer;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;transition:all .2s;background:transparent;color:var(--text-muted);font-family:'Roboto',sans-serif;}
.vt-btn.active{background:var(--gold-grad);color:#0a0d16;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;font-family:'Roboto',sans-serif;text-transform:uppercase;letter-spacing:.8px;}
.btn-primary{background:var(--gold-grad);color:#0a0d16;font-weight:700;}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 16px var(--primary-glow);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg4);color:var(--text);border-color:var(--accent);}
.btn-danger{background:rgba(255,61,87,.12);color:var(--red);border:1px solid rgba(255,61,87,.3);}
.btn-success{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.3);}
.btn-sm{padding:5px 10px;font-size:11px;}
.content{flex:1;overflow-y:auto;padding:22px;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:16px;position:relative;overflow:hidden;transition:border-color .2s;}
.stat-card:hover{border-color:var(--accent);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc-blue::before{background:var(--gold-grad2);}
.sc-green::before{background:linear-gradient(90deg,var(--green),#00ff9d);}
.sc-red::before{background:linear-gradient(90deg,var(--red),#ff6b7a);}
.sc-yellow::before{background:linear-gradient(90deg,var(--yellow),#ffe066);}
.sc-accent::before{background:linear-gradient(90deg,var(--accent),var(--purple));}
.sc-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.ic-blue{background:rgba(202,157,74,.15);}
.ic-green{background:rgba(0,230,118,.1);}
.ic-red{background:rgba(255,61,87,.1);}
.ic-yellow{background:rgba(255,196,0,.1);}
.ic-accent{background:rgba(254,196,99,.1);}
.sc-val{font-family:'Roboto',sans-serif;font-size:28px;font-weight:300;line-height:1;}
.sc-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
.sc-sub{font-size:11px;color:var(--text-dim);margin-top:5px;}

/* CARDS */
.card{background:var(--bg3);border:1px solid rgba(202,157,74,.12);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.card-header{padding:14px 18px;border-bottom:1px solid rgba(202,157,74,.15);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-title{font-family:'Roboto',sans-serif;font-weight:500;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
.card-body{padding:18px;}

/* MAP */
.map-wrap{height:440px;position:relative;}
#leaflet-map{height:100%;width:100%;background:#0d1928;}
.map-legend{position:absolute;bottom:10px;right:10px;z-index:500;background:rgba(10,13,22,.94);border:1px solid rgba(202,157,74,.25);border-radius:8px;padding:10px 14px;backdrop-filter:blur(6px);}
.ml-row{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;margin-bottom:3px;}
.ml-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.map-info-bar{padding:10px 18px;border-top:1px solid rgba(202,157,74,.12);background:var(--bg3);display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px;}
.mib-item{font-size:12px;color:var(--text-dim);}

/* Leaflet */
.leaflet-tile-pane{filter:brightness(.78) saturate(.7) hue-rotate(5deg);}
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;box-shadow:none!important;}
.leaflet-control-zoom a{background:rgba(10,13,22,.9)!important;color:var(--text)!important;border-color:var(--border)!important;width:28px!important;height:28px!important;line-height:28px!important;}
.leaflet-popup-content-wrapper{background:var(--bg2)!important;border:1px solid rgba(202,157,74,.25)!important;border-radius:10px!important;color:var(--text)!important;padding:0!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;}
.leaflet-popup-tip,.leaflet-popup-tip-container{display:none!important;}
.leaflet-popup-content{margin:0!important;min-width:220px!important;}
.leaflet-popup-close-button{color:var(--text-muted)!important;top:10px!important;right:10px!important;}
.pop-inner{padding:14px 16px;}
.pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pop-name{font-weight:500;font-size:14px;letter-spacing:.2px;}
.pop-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
.pop-on{background:rgba(0,230,118,.15);color:var(--green);}
.pop-off{background:rgba(255,61,87,.15);color:var(--red);}
.pop-addr{font-size:12px;color:var(--text-dim);margin-bottom:6px;line-height:1.4;}
.pop-row{display:flex;gap:6px;font-size:11px;color:var(--text-muted);margin-top:3px;}
.pop-row strong{color:var(--text-dim);min-width:52px;}
.pop-row span{font-family:monospace;color:var(--accent);}
.pop-foot{padding:8px 16px;border-top:1px solid var(--border);background:var(--bg3);display:flex;flex-direction:column;gap:6px;}
.pop-btn-row{display:flex;gap:6px;}
.pop-btn{flex:1;padding:7px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:500;font-family:'Roboto',sans-serif;text-transform:uppercase;transition:all .2s;letter-spacing:.5px;}
.pop-btn-primary{background:var(--gold-grad);color:#0a0d16;font-weight:700;}
.pop-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.pop-btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

/* CAM GRID */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.cam-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.cam-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(202,157,74,.12);}
.cam-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.cam-card.online::before{background:var(--green);}
.cam-card.offline::before{background:var(--red);}
.cc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cc-name{font-weight:500;font-size:13px;}
.cc-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
.cc-online{background:rgba(0,230,118,.12);color:var(--green);}
.cc-offline{background:rgba(255,61,87,.12);color:var(--red);}
.cc-addr{font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.cc-meta{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;}
.cc-ip{font-family:monospace;color:var(--accent);font-size:11px;}

/* TICKETS */
.tk-list{display:flex;flex-direction:column;gap:10px;}
.tk-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;}
.tk-card:hover{border-color:var(--accent);}
.tk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
.tk-id{font-size:11px;color:var(--accent);font-family:monospace;font-weight:600;margin-bottom:2px;}
.tk-title{font-size:14px;font-weight:500;letter-spacing:.2px;}
.tk-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;}
.tk-meta{font-size:11px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tk-desc{font-size:12px;color:var(--text-muted);margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.tk-priority{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;}
.p-alta{background:rgba(255,61,87,.12);color:var(--red);}
.p-media{background:rgba(255,196,0,.1);color:var(--yellow);}
.p-baixa{background:rgba(0,230,118,.1);color:var(--green);}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.s-aberto{background:rgba(255,196,0,.1);color:var(--yellow);}
.s-reconhecido{background:rgba(0,200,255,.1);color:#00c8ff;}
.s-tecnico{background:rgba(0,102,255,.12);color:#0066ff;}
.s-agendado{background:rgba(167,139,250,.12);color:var(--purple);}
.s-andamento{background:rgba(255,196,0,.1);color:var(--yellow);}
.s-finalizado{background:rgba(0,230,118,.1);color:var(--green);}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg-full{grid-column:1/-1;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-label{font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
.f-input,.f-select,.f-textarea{background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:6px;font-size:13px;font-family:'Roboto',sans-serif;outline:none;width:100%;transition:border-color .2s;}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--accent);}
.f-input:disabled{opacity:.6;}
.f-textarea{resize:vertical;min-height:80px;}
.sep{height:1px;background:var(--border);margin:14px 0;}
.info-row{display:flex;gap:6px;font-size:12px;color:var(--text-dim);padding:3px 0;align-items:flex-start;}
.info-row strong{color:var(--text);min-width:110px;font-size:11px;flex-shrink:0;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid rgba(202,157,74,.2);border-radius:12px;width:100%;max-width:740px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 64px rgba(0,0,0,.6);}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:var(--border);}
.modal-head{padding:18px 22px;border-bottom:1px solid rgba(202,157,74,.2);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Roboto',sans-serif;font-weight:500;font-size:16px;letter-spacing:.3px;}
.modal-body{padding:22px;}
.modal-foot{padding:14px 22px;border-top:1px solid rgba(202,157,74,.15);display:flex;justify-content:flex-end;gap:8px;}

/* TIMELINE */
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border);}
.tl-item{position:relative;margin-bottom:18px;}
.tl-dot{position:absolute;left:-18px;top:3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg2);}
.tl-done{background:var(--green);}
.tl-curr{background:var(--yellow);box-shadow:0 0 8px var(--yellow);}
.tl-pend{background:var(--border);}
.tl-status{font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.tl-note{font-size:13px;color:var(--text);margin-bottom:3px;}
.tl-meta{font-size:11px;color:var(--text-muted);}
.tl-dur{font-size:10px;color:var(--yellow);background:rgba(255,196,0,.08);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:4px;}

/* USERS */
.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.user-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:16px;}

/* LOGIN */
.login-page{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{background:var(--bg2);border:1px solid rgba(202,157,74,.25);border-radius:14px;padding:38px;width:420px;box-shadow:0 32px 64px rgba(0,0,0,.6);}
.login-logo{text-align:center;margin-bottom:16px;}
.login-logo img{height:50px;object-fit:contain;}
.login-sub{font-size:11px;color:var(--accent2);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:26px;font-weight:500;}
.login-err{background:rgba(255,61,87,.1);border:1px solid rgba(255,61,87,.3);border-radius:6px;padding:9px 13px;color:var(--red);font-size:13px;margin-bottom:14px;}
.demo-sec{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
.demo-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.demo-btn{display:block;width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Roboto',sans-serif;margin-bottom:6px;text-align:left;}
.demo-btn:hover{border-color:var(--accent);background:var(--primary-dim);}
.demo-cred{font-size:11px;color:var(--text-muted);font-family:monospace;}

/* MISC */
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-muted);}
.upload-zone:hover{border-color:var(--accent);color:var(--text);background:var(--primary-dim);}
.img-previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.img-thumb{width:72px;height:54px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
.empty{text-align:center;padding:48px 0;color:var(--text-muted);}
.tag-strip{display:flex;gap:6px;flex-wrap:wrap;}

/* LOADING OVERLAY */
.loading-overlay{position:fixed;inset:0;background:rgba(10,13,22,.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loading-overlay img{height:50px;object-fit:contain;}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 1.5s infinite;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg2);border:1px solid rgba(202,157,74,.3);border-radius:8px;padding:10px 20px;font-size:13px;color:var(--text);z-index:9999;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

const fmtDate  = d => new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const timeDiff = (a,b) => {const ms=new Date(b)-new Date(a),h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return h>24?Math.floor(h/24)+'d '+h%24+'h':h>0?h+'h '+m+'min':m+'min';};
const statusClass = s => ({'Aberto':'s-aberto','Reconhecido':'s-reconhecido','Técnico Designado':'s-tecnico','Agendado':'s-agendado','Em Andamento':'s-andamento','Finalizado':'s-finalizado'}[s]||'s-aberto');
const effRole   = () => currentUser.role==='admin' ? viewAs : currentUser.role;
const openTks   = () => tickets.filter(t=>t.status!=='Finalizado');
const myTks     = () => currentUser.role==='tech' ? tickets.filter(t=>t.tech_id===currentUser.id) : tickets;
const techs     = () => USERS.filter(u=>u.role==='tech');

const getOffline = () => CAMERAS.filter(c=>c.status==='offline').length;
const makeAvatar = n => n.split(' ').filter((_,i,a)=>i===0||i===a.length-1).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'??';
const roleLabel  = r => r==='admin'?'Administrador':r==='tech'?'Técnico':'Cliente';
const roleClass  = r => r==='admin'?'s-tecnico':r==='tech'?'s-reconhecido':'s-finalizado';

function showToast(msg, dur=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}
function setLoading(show){
  const el=document.getElementById('loading-overlay');
  if(el) el.style.display = show ? 'flex' : 'none';
}

// ── GPS ───────────────────────────────────────────────────────────────────────
function openGps(lat,lng,name){
  const enc=encodeURIComponent(name);
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid=/Android/.test(navigator.userAgent);
  if(isIOS){ window.location.href=`maps://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`; setTimeout(()=>window.open(`https://maps.google.com/maps?daddr=${lat},${lng}`,'_blank'),500); }
  else if(isAndroid){ window.location.href=`geo:${lat},${lng}?q=${lat},${lng}(${enc})`; setTimeout(()=>window.open(`https://maps.google.com/maps?daddr=${lat},${lng}`,'_blank'),500); }
  else window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`,'_blank');
}

// ── INIT — load data from Supabase ────────────────────────────────────────────
async function init(){
  setLoading(true);
  try {
    // Load users
    USERS = await sbGet('users','select=*&order=created_at.asc');
    // Load tickets with all fields
    const rawTks = await sbGet('tickets','select=*&order=created_at.desc');
    tickets = rawTks.map(normalizeTicket);
    // Cameras already loaded from KMZ; optionally sync from DB
    try {
      const dbCams = await sbGet('cameras','select=*&order=id.asc');
      if(dbCams && dbCams.length > 0) CAMERAS = dbCams.map(c=>({...c, model: c.model||'Intelbras/Hikvision'}));
    } catch(e){ /* use KMZ cameras */ }
    setLoading(false);
    render();
  } catch(err){
    console.error('Init error:', err);
    setLoading(false);
    // Fall back to offline demo mode
    USERS = [
      {id:'00000000-0000-0000-0000-000000000001',name:'Carlos Admin',email:'admin@segvision.com.br',phone:'(62) 99999-0001',role:'admin',password_hash:'admin123',avatar:'CA'},
      {id:'00000000-0000-0000-0000-000000000002',name:'Fernanda Cliente',email:'fernanda@cliente.com.br',phone:'(62) 98888-0002',role:'client',password_hash:'cliente123',avatar:'FC'},
      {id:'00000000-0000-0000-0000-000000000003',name:'Ricardo Técnico',email:'ricardo@segvision.com.br',phone:'(62) 97777-0003',role:'tech',password_hash:'tecnico123',avatar:'RT'},
    ];
    showToast('⚠ Modo offline — banco não conectado. Execute o SQL no Supabase.', 6000);
    render();
  }
}

function normalizeTicket(t){
  // Convert DB snake_case to app format
  return {
    id: t.id,
    title: t.title,
    cameraId: t.camera_id,
    status: t.status,
    priority: t.priority,
    requester: {name: t.requester_name, email: t.requester_email, phone: t.requester_phone},
    description: t.description,
    tech_id: t.tech_id,
    techId: t.tech_id,
    displacement: t.displacement,
    images: t.images||[],
    timeline: t.timeline||[],
    createdAt: t.created_at,
  };
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.style.display='none';
  const u = USERS.find(x => x.email===email && x.password_hash===pass);
  if(u){ currentUser=u; viewAs=u.role; render(); }
  else { errEl.textContent='E-mail ou senha inválidos.'; errEl.style.display='block'; }
}
function quickLogin(email){
  const u=USERS.find(x=>x.email===email);
  if(u){ currentUser=u; viewAs=u.role; render(); }
}
function doLogout(){ currentUser=null; leafletMap=null; render(); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('root').innerHTML = currentUser ? renderShell() : renderLogin();
  bindKeys();
  if(page==='dashboard'||page==='cameras') requestAnimationFrame(initMap);
}

function renderPage(){
  if(page==='dashboard') return renderDashboard();
  if(page==='cameras')   return renderCameras();
  if(page==='tickets')   return renderTickets();
  if(page==='users')     return renderUsers();
  return '';
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  const er=effRole();
  const on=getOnline(),off=getOffline(),tot=CAMERAS.length,pct=Math.round(on/tot*100);
  const tks=er==='tech'?myTks():tickets;
  return `
  <div class="stats-grid">
    <div class="stat-card sc-blue"><div class="sc-icon ic-blue">${IC.cam}</div><div class="sc-val">${tot}</div><div class="sc-lbl">Total</div><div class="sc-sub">câmeras</div></div>
    <div class="stat-card sc-green"><div class="sc-icon ic-green">${IC.check}</div><div class="sc-val" style="color:var(--green)">${on}</div><div class="sc-lbl">Online</div><div class="sc-sub" style="color:var(--green)">operacionais</div></div>
    <div class="stat-card sc-red"><div class="sc-icon ic-red">${IC.alert}</div><div class="sc-val" style="color:var(--red)">${off}</div><div class="sc-lbl">Offline</div><div class="sc-sub" style="color:var(--red)">requerem atenção</div></div>
    <div class="stat-card sc-yellow"><div class="sc-icon ic-yellow">${IC.eye}</div><div class="sc-val" style="color:var(--yellow)">${pct}%</div><div class="sc-lbl">Disponibilidade</div><div class="sc-sub">${on}/${tot} câmeras</div></div>
    <div class="stat-card sc-accent"><div class="sc-icon ic-accent">${IC.ticket}</div><div class="sc-val" style="color:var(--accent)">${openTks().length}</div><div class="sc-lbl">Tickets Abertos</div><div class="sc-sub">${tickets.filter(t=>t.status==='Finalizado').length} finalizados</div></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">${IC.cam} Mapa de Câmeras — Goiânia, GO</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-sm${mapFilter==='all'?' btn-primary':' btn-ghost'}" onclick="setMapFilter('all')">Todas (${tot})</button>
        <button class="btn btn-sm${mapFilter==='online'?' btn-success':' btn-ghost'}" onclick="setMapFilter('online')">● Online (${on})</button>
        <button class="btn btn-sm${mapFilter==='offline'?' btn-danger':' btn-ghost'}" onclick="setMapFilter('offline')">● Offline (${off})</button>
        <div style="position:relative">

// ── MAP ───────────────────────────────────────────────────────────────────────
function initMap(){
  const el=document.getElementById('leaflet-map');
  if(!el||leafletMap) return;
  leafletMap=L.map('leaflet-map',{center:[-16.6795,-49.2736],zoom:13,zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(leafletMap);
  markersLayer=L.layerGroup().addTo(leafletMap);
  renderMapMarkers();
  leafletMap.fitBounds(L.latLngBounds(CAMERAS.map(c=>[c.lat,c.lng])),{padding:[40,40]});
}
function makeMarkerIcon(status){
  const color=status==='online'?'#00e676':'#ff3d57';
  const glow=status==='online'?'rgba(0,230,118,0.7)':'rgba(255,61,87,0.7)';
  return L.divIcon({className:'',html:`<div style="filter:drop-shadow(0 0 4px ${glow})"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${color}" opacity="0.2"/><circle cx="10" cy="10" r="5.5" fill="${color}"/><circle cx="10" cy="10" r="2.5" fill="#0a0d16"/></svg></div>`,iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-12]});
}
function renderMapMarkers(){
  if(!markersLayer) return;
  markersLayer.clearLayers();
  let list=CAMERAS;
  if(mapFilter==='online') list=list.filter(c=>c.status==='online');
  if(mapFilter==='offline') list=list.filter(c=>c.status==='offline');
  if(mapSearch){const q=mapSearch.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.address.toLowerCase().includes(q));}
  const er=effRole();
  list.forEach(cam=>{
    const marker=L.marker([cam.lat,cam.lng],{icon:makeMarkerIcon(cam.status)});
    const sc=cam.status==='online'?'pop-on':'pop-off';
    const ticketBtn=(er==='admin'||er==='client')&&cam.status==='offline'
      ?`<button class="pop-btn pop-btn-primary" onclick="selectedCam=CAMERAS.find(c=>c.id===${cam.id});openNewTicket()">🎫 Abrir Chamado</button>`
      :`<button class="pop-btn pop-btn-ghost">✓ Operacional</button>`;
    marker.bindPopup(`
      <div class="pop-inner">
        <div class="pop-head"><div class="pop-name">${cam.name}</div><span class="pop-badge ${sc}">${cam.status}</span></div>
        <div class="pop-addr">📍 ${cam.address}</div>
        <div class="pop-row"><strong>IP:</strong><span>${cam.ip||'—'}</span></div>
        <div class="pop-row"><strong>Modelo:</strong><span style="font-family:inherit;color:var(--text-dim)">${cam.model||'—'}</span></div>
      </div>
      <div class="pop-foot">
        <button class="pop-btn" style="background:var(--gold-grad);color:#0a0d16;font-weight:700" onclick="openGps(${cam.lat},${cam.lng},'${cam.name}')">🧭 Navegar até a Câmera</button>
        <div class="pop-btn-row">${ticketBtn}<button class="pop-btn pop-btn-ghost" onclick="openCamHistory(${cam.id})">📋 Histórico</button></div>
      </div>`,{maxWidth:260,minWidth:240});
    marker.on('click',()=>{
      selectedCam=cam;
      const bar=document.getElementById('map-info-bar');
      if(!bar) return;
      const _tb=(er==='admin'||er==='client')&&cam.status==='offline'
        ?'<button class="btn btn-danger btn-sm" onclick="selectedCam=CAMERAS.find(c=>c.id==='+cam.id+');openNewTicket()">🎫 Chamado</button>':'';
      bar.innerHTML='<span class="mib-item"><strong>'+cam.name+'</strong></span>'
        +'<span class="mib-item">📍 '+cam.address+'</span>'
        +'<span class="mib-item" style="font-family:monospace;color:var(--accent)">'+cam.ip+'</span>'
        +'<span class="mib-item"><span class="badge '+(cam.status==='online'?'cc-online':'cc-offline')+'">'+cam.status+'</span></span>'
        +'<span style="margin-left:auto;display:flex;gap:6px">'
        +'<button class="btn btn-ghost btn-sm" onclick="openCamHistory('+cam.id+')">📋 Histórico</button>'
        +'<button class="btn btn-sm" style="background:var(--gold-grad);color:#0a0d16;font-weight:700" onclick="openGps('+cam.lat+','+cam.lng+',\'gps\')">🧭 GPS</button>'
        +_tb+'</span>';
    });
    markersLayer.addLayer(marker);
  });
}
function setMapFilter(f){mapFilter=f;renderMapMarkers();render();}
function setMapSearch(v){mapSearch=v;renderMapMarkers();}
function focusCam(id){const c=CAMERAS.find(x=>x.id===id);if(c&&leafletMap)leafletMap.setView([c.lat,c.lng],17,{animate:true});openCamHistory(id);}

      <div>

        <div class="info-row"><strong>Solicitante:</strong>${t.requester?.name||''}</div>
        <div class="info-row"><strong>E-mail:</strong>${t.requester?.email||''}</div>
        <div class="info-row"><strong>Telefone:</strong>${t.requester?.phone||''}</div>
        <div class="info-row"><strong>Câmera:</strong>${cam?cam.name:'—'}</div>
        <div class="info-row"><strong>Endereço:</strong>${cam?cam.address:'—'}</div>
        <div class="info-row"><strong>Prioridade:</strong><span class="tk-priority p-${t.priority.toLowerCase()}">${t.priority}</span></div>
        <div class="info-row"><strong>Aberto em:</strong>${fmtDate(t.createdAt||t.created_at)}</div>
        ${(t.techId||t.tech_id)?`<div class="info-row"><strong>Técnico:</strong>${USERS.find(u=>u.id===(t.techId||t.tech_id))?.name||'—'}</div>`:''}
        ${t.displacement?`<div class="info-row"><strong>Deslocamento:</strong>${t.displacement}</div>`:''}
        ${cam?`<div style="margin-top:12px"><button class="btn btn-sm" style="background:var(--gold-grad);color:#0a0d16;font-weight:700" onclick="openGps(${cam.lat},${cam.lng},'${cam.name}')">${IC.nav} Navegar até a Câmera</button></div>`:''}
        <div class="sep"></div>
        <div style="font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Descrição</div>
        <p style="font-size:13px;color:var(--text);line-height:1.6">${t.description}</p>
        ${renderTicketActions(t,isAdmin,isTech)}
      </div>
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">Linha do Tempo</div>
        <div class="timeline">
          ${(t.timeline||[]).map((e,i)=>{
            const isLast=i===t.timeline.length-1;
            const next=t.timeline[i+1];
            const dur=next?timeDiff(e.date,next.date):null;
            const dot=t.status==='Finalizado'?'tl-done':isLast?'tl-curr':'tl-done';
            return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="tl-status">${e.status}</div><div class="tl-note">${e.note}</div><div class="tl-meta">por ${e.user} · ${fmtDate(e.date)}</div>${dur?`<div class="tl-dur">⏱ ${dur} nesta etapa</div>`:''}</div>`;

          ${t.status!=='Finalizado'?`<div class="tl-item" style="opacity:.35"><div class="tl-dot tl-pend"></div><div class="tl-status">${STATUS_FLOW[STATUS_FLOW.indexOf(t.status)+1]||'—'}</div><div class="tl-note" style="color:var(--text-muted)">Aguardando...</div></div>`:''}
        </div>
      </div>
    </div>
  </div></div>`;
}
function renderTicketActions(t,isAdmin,isTech){

  if(isTech&&t.status==='Em Andamento') return `<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">

    </div>
    <button class="btn btn-success btn-sm" onclick="finalizarTicket('${t.id}')">${IC.check} Finalizar Ticket</button>
  </div>`;

function buildCamHistory(){
  CAM_HISTORY={};

    const last=t.timeline[t.timeline.length-1];
    const tech=USERS.find(u=>u.id===(t.techId||t.tech_id));
    const note=last?.note||'';
    const causeMatch=note.match(/Causa: (.+?) \| Solução:/);
    const solMatch=note.match(/Solução: (.+)$/);
    CAM_HISTORY[cid].push({ticketId:t.id,date:last?.date||t.createdAt,techName:tech?.name||'Não informado',techAvatar:tech?.avatar||'??',cause:causeMatch?causeMatch[1]:note,solution:solMatch?solMatch[1]:'',priority:t.priority,images:t.images||[],duration:t.timeline.length>1?timeDiff(t.timeline[0].date,last.date):'—'});
  });
  Object.keys(CAM_HISTORY).forEach(k=>CAM_HISTORY[k].sort((a,b)=>new Date(b.date)-new Date(a.date)));
}

function handleKmzFile(file){
  if(!file) return;
  importState={status:'loading',log:['📂 '+file.name+' ('+( file.size/1024).toFixed(1)+' KB)'],cameras:null};
  render();
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      let kmlText='';
      if(file.name.toLowerCase().endsWith('.kmz')){
        importState.log.push('📦 Descompactando...');
        const zip=await JSZip.loadAsync(e.target.result);
        const kmlFile=zip.file(/\.kml$/i)[0];
        if(!kmlFile) throw new Error('Nenhum .kml encontrado');
        kmlText=await kmlFile.async('text');
        importState.log.push('✓ KML extraído');
      } else { kmlText=new TextDecoder().decode(e.target.result); }
      importState.log.push('🔍 Analisando marcadores...');
      const cameras=parseKml(kmlText);
      if(!cameras||cameras.length===0) throw new Error('Nenhum marcador encontrado');
      importState.log.push('✓ '+cameras.length+' câmeras encontradas');
      importState.status='preview'; importState.cameras=cameras; render();
    } catch(err){ importState.status='error'; importState.log.push('❌ '+err.message); render(); }
  };
  reader.onerror=()=>{importState.status='error';importState.log.push('❌ Erro ao ler');render();};
  reader.readAsArrayBuffer(file);
}
function parseKml(kmlText){
  const doc=new DOMParser().parseFromString(kmlText,'text/xml');
  const styleMap={};
  doc.querySelectorAll('Style').forEach(s=>{
    const id='#'+(s.getAttribute('id')||'');
    const href=s.querySelector('href')?.textContent||'';
    if(id.includes('ci-2')||href.includes('icon-2')) styleMap[id]='online';
    else if(id.includes('ci-1')||href.includes('icon-1')) styleMap[id]='offline';
  });
  const cameras=[];
  doc.querySelectorAll('Placemark').forEach((pm,i)=>{
    const name=pm.querySelector('name')?.textContent?.trim()||'Ponto '+(i+1);
    const style=pm.querySelector('styleUrl')?.textContent?.trim()||'';
    const coordStr=pm.querySelector('coordinates')?.textContent?.trim();
    if(!coordStr) return;
    const parts=coordStr.split(',');
    const lng=parseFloat(parts[0]),lat=parseFloat(parts[1]);
    if(isNaN(lat)||isNaN(lng)) return;
    let status=styleMap[style]||(style.includes('ci-1')?'offline':style.includes('ci-2')?'online':'online');
    const nameParts=name.split(' - ');
    const pnum=nameParts[0].replace('Ponto','').trim();
    const addr=nameParts.length>1?nameParts.slice(1).join(' - '):name;
    cameras.push({id:i+1,name:'CAM-'+String(pnum).padStart(3,'0'),address:addr,lat,lng,status,ip:'192.168.'+(Math.floor(i/254)+1)+'.'+(i%254+1),model:'Intelbras/Hikvision',location:addr});
  });
  return cameras;
}
async function applyImport(){
  if(!importState.cameras||!importState.cameras.length) return;
  CAMERAS.length=0;
  importState.cameras.forEach(c=>CAMERAS.push(c));
  // Sync to Supabase
  try {
    setLoading(true);
    // Delete all existing cameras and reinsert
    await sbDelete('cameras','id=gte.0');
    const chunks=[];
    for(let i=0;i<CAMERAS.length;i+=50) chunks.push(CAMERAS.slice(i,i+50));
    for(const chunk of chunks){
      await sbPost('cameras', chunk.map(c=>({id:c.id,name:c.name,address:c.address,lat:c.lat,lng:c.lng,status:c.status,ip:c.ip,model:c.model,location:c.location})));
    }
    setLoading(false);
    showToast('✓ '+CAMERAS.length+' câmeras sincronizadas com o banco!');
  } catch(e){
    setLoading(false);
    showToast('⚠ Câmeras atualizadas localmente (erro ao sincronizar BD)');
  }
  leafletMap=null; markersLayer=null;
  importState.status='done'; render();
}

  if(!techId||!disp){alert('Selecione técnico e deslocamento.');return;}
  const tech=USERS.find(u=>u.id===techId);
  const newStatus=disp==='Agendar Visita'?'Agendado':'Técnico Designado';
  await advanceTicket(id,newStatus,tech.name+' designado. '+disp+'.',{tech_id:techId,techId,displacement:disp});
}

async function finalizarTicket(id){
  const cause=document.getElementById('tk-cause')?.value;
  const sol=document.getElementById('tk-solution')?.value;
  if(!cause||!sol){alert('Preencha causa e solução.');return;}
  const imgs=[...document.querySelectorAll('#img-prev .img-thumb')].map(i=>i.src);
  tickets=tickets.map(t=>t.id!==id?t:{...t,images:imgs});
  await advanceTicket(id,'Finalizado','Causa: '+cause+' | Solução: '+sol,{images:imgs});
}

function previewImgs(input){
  const prev=document.getElementById('img-prev');if(!prev)return;
  Array.from(input.files).forEach(f=>{const r=new FileReader();r.onload=e=>{const img=document.createElement('img');img.src=e.target.result;img.className='img-thumb';prev.appendChild(img);};r.readAsDataURL(f);});
}

async function submitNewTicket(){
  const camId=parseInt(document.getElementById('nt-cam').value);
  const desc=document.getElementById('nt-desc').value.trim();
  const pri=document.getElementById('nt-pri').value;
  if(!camId||!desc){alert('Selecione a câmera e descreva o problema.');return;}
  const cam=CAMERAS.find(c=>c.id===camId);
  const now=new Date().toISOString();
  const tkId='TK-'+String(tickets.length+1).padStart(3,'0');
  const newTk={id:tkId,title:'Chamado - '+cam.name,camera_id:camId,status:'Aberto',priority:pri,requester_name:currentUser.name,requester_email:currentUser.email,requester_phone:currentUser.phone||'',description:desc,tech_id:null,displacement:null,images:[],timeline:[{status:'Aberto',date:now,user:currentUser.name,note:'Ticket aberto.'}],created_at:now,updated_at:now};
  try {
    const [saved]=await sbPost('tickets',newTk);
    tickets=[normalizeTicket(saved),...tickets];
    showToast('✓ Chamado aberto com sucesso!');
  } catch(e){
    tickets=[normalizeTicket(newTk),...tickets];
    showToast('⚠ Chamado salvo localmente');
  }
  showNewTicket=false; page='tickets'; render();
}

async function saveUser(id){
  const name=document.getElementById('um-name').value.trim();
  const email=document.getElementById('um-email').value.trim();
  const phone=document.getElementById('um-phone').value.trim();
  const role=document.getElementById('um-role').value;
  const pass=document.getElementById('um-pass').value;
  const pass2=document.getElementById('um-pass2').value;
  const errEl=document.getElementById('um-error');
  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  errEl.style.display='none';
  if(!name) return showErr('Nome obrigatório.');
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('E-mail inválido.');
  const isNew=id===null;
  if(isNew&&!pass) return showErr('Senha obrigatória.');
  if(pass&&pass.length<6) return showErr('Mínimo 6 caracteres.');
  if(pass&&pass!==pass2) return showErr('Senhas não coincidem.');
  if(USERS.find(u=>u.email===email&&u.id!==id)) return showErr('E-mail já cadastrado.');
  const avatar=makeAvatar(name);
  try {
    if(isNew){
      const [saved]=await sbPost('users',{name,email,phone,role,password_hash:pass,avatar});
      USERS=[...USERS,saved];
    } else {
      const upd={name,email,phone,role,avatar};
      if(pass) upd.password_hash=pass;
      const [saved]=await sbPatch('users','id=eq.'+id,upd);
      USERS=USERS.map(u=>u.id!==id?u:{...u,...saved});
      if(currentUser.id===id) currentUser=USERS.find(u=>u.id===id);
    }
    showToast('✓ Usuário salvo!');
  } catch(e){
    if(isNew) USERS=[...USERS,{id:'local-'+Date.now(),name,email,phone,role,password_hash:pass,avatar}];
    else USERS=USERS.map(u=>u.id!==id?u:{...u,name,email,phone,role,avatar,...(pass?{password_hash:pass}:{})});
    showToast('⚠ Salvo localmente');
  }
  closeUserModal();
}

async function deleteUserAction(){
  try {
    await sbDelete('users','id=eq.'+deleteUserId);
    showToast('✓ Usuário excluído');
  } catch(e){ showToast('⚠ Removido localmente'); }
  USERS=USERS.filter(u=>u.id!==deleteUserId);
  tickets=tickets.map(t=>t.tech_id===deleteUserId?{...t,tech_id:null,techId:null}:t);
  deleteUserId=null; render();
}

async function reloadData(){
  showToast('🔄 Atualizando dados...');
  try {
    USERS=await sbGet('users','select=*&order=created_at.asc');
    const rawTks=await sbGet('tickets','select=*&order=created_at.desc');
    tickets=rawTks.map(normalizeTicket);
    try {
      const dbCams=await sbGet('cameras','select=*&order=id.asc');
      if(dbCams&&dbCams.length>0) CAMERAS=dbCams.map(c=>({...c,model:c.model||'Intelbras/Hikvision'}));
    } catch(e){}
    leafletMap=null; markersLayer=null;
    showToast('✓ Dados atualizados!');
    render();
  } catch(e){ showToast('❌ Erro ao atualizar: '+e.message); }
}

function bindKeys(){
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(previewImg){previewImg=null;render();}
      else if(openTicketId){closeTicket();}
      else if(showNewTicket){closeNewTicket();}
      else if(camHistoryId){closeCamHistory();}
      else if(showImportModal){closeImportModal();}
      else if(showUserModal){closeUserModal();}
      else if(deleteUserId){cancelDelete();}
    }
  },{once:true});
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
