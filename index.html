<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brilha Goiânia — Monitoramento</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d16;--bg2:#0c101b;--bg3:#101525;--bg4:#161d2e;
  --border:#1e2a3a;
  --primary:#ca9d4a;--primary-dim:rgba(202,157,74,0.12);--primary-glow:rgba(202,157,74,0.4);
  --accent:#fec463;--accent2:#9a6e31;
  --green:#00e676;--red:#ff3d57;--yellow:#ffc400;--purple:#a78bfa;
  --text:#e7e9ec;--text-dim:#8a94a8;--text-muted:#3d4d66;
  --gold-grad:linear-gradient(135deg,#9a6e31,#fec463,#ca9d4a);
  --gold-grad2:linear-gradient(90deg,#9a6e31,#fec463);
  --sidebar:230px;--topbar:58px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;overflow:hidden;}
.app{display:flex;height:100vh;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid rgba(202,157,74,.15);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:200;}
.sidebar::after{content:'';position:absolute;right:-1px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--accent),transparent);opacity:.4;}
.sb-logo{height:var(--topbar);padding:0 16px;border-bottom:1px solid rgba(202,157,74,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(202,157,74,.03);}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto;}
.sb-sec{padding:8px 16px 4px;font-size:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:2px;}
.sb-sep{height:1px;background:rgba(202,157,74,.1);margin:6px 16px;}
.nav-sub{display:flex;align-items:center;gap:9px;padding:8px 16px 8px 32px;cursor:pointer;transition:all .2s;color:var(--text-muted);border-left:3px solid transparent;font-size:12px;user-select:none;}
.nav-sub:hover{background:rgba(202,157,74,.05);color:var(--text);}
.nav-sub.active{background:rgba(202,157,74,.08);color:var(--accent);border-left-color:var(--accent);}
.nav-sub svg{width:14px;height:14px;flex-shrink:0;}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 16px;cursor:pointer;transition:all .2s;color:var(--text-dim);border-left:3px solid transparent;font-size:13px;font-weight:400;letter-spacing:.2px;user-select:none;}
.nav-item:hover{background:rgba(202,157,74,.07);color:var(--text);}
.nav-item.active{background:rgba(202,157,74,.1);color:var(--accent);border-left-color:var(--accent);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;}
.sb-user{padding:12px 16px;border-top:1px solid rgba(202,157,74,.15);display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:var(--gold-grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#0a0d16;}
.uinfo{flex:1;min-width:0;}
.uname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urole{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:4px;transition:color .2s;display:flex;}
.icon-btn:hover{color:var(--red);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
.topbar{background:var(--bg2);border-bottom:1px solid rgba(202,157,74,.2);height:var(--topbar);padding:0 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-family:'Roboto',sans-serif;font-weight:500;font-size:16px;letter-spacing:.5px;background:var(--gold-grad2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.view-toggle{display:flex;background:var(--bg3);border:1px solid rgba(202,157,74,.2);border-radius:6px;overflow:hidden;}
.vt-btn{padding:5px 11px;border:none;cursor:pointer;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;transition:all .2s;background:transparent;color:var(--text-muted);font-family:'Roboto',sans-serif;}
.vt-btn.active{background:var(--gold-grad);color:#0a0d16;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;font-family:'Roboto',sans-serif;text-transform:uppercase;letter-spacing:.8px;}
.btn-primary{background:var(--gold-grad);color:#0a0d16;font-weight:700;}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 16px var(--primary-glow);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg4);color:var(--text);border-color:var(--accent);}
.btn-danger{background:rgba(255,61,87,.12);color:var(--red);border:1px solid rgba(255,61,87,.3);}
.btn-success{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.3);}
.btn-sm{padding:5px 10px;font-size:11px;}
.content{flex:1;padding:22px;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:16px;position:relative;overflow:hidden;transition:border-color .2s;}
.stat-card:hover{border-color:var(--accent);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc-blue::before{background:var(--gold-grad2);}
.sc-green::before{background:linear-gradient(90deg,var(--green),#00ff9d);}
.sc-red::before{background:linear-gradient(90deg,var(--red),#ff6b7a);}
.sc-yellow::before{background:linear-gradient(90deg,var(--yellow),#ffe066);}
.sc-accent::before{background:linear-gradient(90deg,var(--accent),var(--purple));}
.sc-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.ic-blue{background:rgba(202,157,74,.15);}
.ic-green{background:rgba(0,230,118,.1);}
.ic-red{background:rgba(255,61,87,.1);}
.ic-yellow{background:rgba(255,196,0,.1);}
.ic-accent{background:rgba(254,196,99,.1);}
.sc-val{font-family:'Roboto',sans-serif;font-size:28px;font-weight:300;line-height:1;}
.sc-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
.sc-sub{font-size:11px;color:var(--text-dim);margin-top:5px;}

/* CARDS */
.card{background:var(--bg3);border:1px solid rgba(202,157,74,.12);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.card-map-sticky{position:sticky;top:0;z-index:10;}
.card-header{padding:14px 18px;border-bottom:1px solid rgba(202,157,74,.15);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-title{font-family:'Roboto',sans-serif;font-weight:500;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
.card-body{padding:18px;}

/* MAP */
.map-wrap{height:440px;position:relative;}
#leaflet-map{height:100%;width:100%;background:#0d1928;}
.map-legend{position:absolute;bottom:10px;right:10px;z-index:500;background:rgba(10,13,22,.94);border:1px solid rgba(202,157,74,.25);border-radius:8px;padding:10px 14px;backdrop-filter:blur(6px);}
.ml-row{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;margin-bottom:3px;}
.ml-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.map-info-bar{padding:10px 18px;border-top:1px solid rgba(202,157,74,.12);background:var(--bg3);display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px;}
.mib-item{font-size:12px;color:var(--text-dim);}

/* Leaflet */
.leaflet-tile-pane{filter:brightness(0.82) saturate(0.75);}
.leaflet-tile{transition:opacity 0.2s;}
.leaflet-container{background:#aad3df !important;}
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;box-shadow:none!important;}
.leaflet-control-zoom a{background:rgba(10,13,22,.9)!important;color:var(--text)!important;border-color:var(--border)!important;width:28px!important;height:28px!important;line-height:28px!important;}
.leaflet-popup-content-wrapper{background:var(--bg2)!important;border:1px solid rgba(202,157,74,.25)!important;border-radius:10px!important;color:var(--text)!important;padding:0!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;}
.leaflet-popup-tip,.leaflet-popup-tip-container{display:none!important;}
.leaflet-popup-content{margin:0!important;min-width:220px!important;}
.leaflet-popup-close-button{color:var(--text-muted)!important;top:10px!important;right:10px!important;}
.pop-inner{padding:14px 16px;}
.pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pop-name{font-weight:500;font-size:14px;letter-spacing:.2px;}
.pop-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
.pop-on{background:rgba(0,230,118,.15);color:var(--green);}
.pop-off{background:rgba(255,61,87,.15);color:var(--red);}
.pop-addr{font-size:12px;color:var(--text-dim);margin-bottom:6px;line-height:1.4;}
.pop-row{display:flex;gap:6px;font-size:11px;color:var(--text-muted);margin-top:3px;}
.pop-row strong{color:var(--text-dim);min-width:52px;}
.pop-row span{font-family:monospace;color:var(--accent);}
.pop-foot{padding:8px 16px;border-top:1px solid var(--border);background:var(--bg3);display:flex;flex-direction:column;gap:6px;}
.pop-btn-row{display:flex;gap:6px;}
.pop-btn{flex:1;padding:7px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:500;font-family:'Roboto',sans-serif;text-transform:uppercase;transition:all .2s;letter-spacing:.5px;}
.pop-btn-primary{background:var(--gold-grad);color:#0a0d16;font-weight:700;}
.pop-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.pop-btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

/* CAM GRID */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.cam-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.cam-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(202,157,74,.12);}
.cam-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.cam-card.online::before{background:var(--green);}
.cam-card.offline::before{background:var(--red);}
.cc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cc-name{font-weight:500;font-size:13px;}
.cc-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
.cc-online{background:rgba(0,230,118,.12);color:var(--green);}
.cc-offline{background:rgba(255,61,87,.12);color:var(--red);}
.cc-addr{font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.cc-meta{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;}
.cc-ip{font-family:monospace;color:var(--accent);font-size:11px;}

/* TICKETS */
.tk-list{display:flex;flex-direction:column;gap:10px;}
.tk-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;}
.tk-card:hover{border-color:var(--accent);}
.tk-del-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px 6px;border-radius:4px;transition:all .2s;flex-shrink:0;display:flex;align-items:center;}
.tk-del-btn:hover{color:var(--red);background:rgba(255,61,87,.1);}
.tk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
.tk-id{font-size:11px;color:var(--accent);font-family:monospace;font-weight:600;margin-bottom:2px;}
.tk-title{font-size:14px;font-weight:500;letter-spacing:.2px;}
.tk-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;}
.tk-meta{font-size:11px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tk-desc{font-size:12px;color:var(--text-muted);margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.tk-priority{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;}
.p-alta{background:rgba(255,61,87,.12);color:var(--red);}
.p-media{background:rgba(255,196,0,.1);color:var(--yellow);}
.p-baixa{background:rgba(0,230,118,.1);color:var(--green);}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.s-aberto{background:rgba(255,196,0,.1);color:var(--yellow);}
.s-reconhecido{background:rgba(0,200,255,.1);color:#00c8ff;}
.s-tecnico{background:rgba(0,102,255,.12);color:#0066ff;}
.s-agendado{background:rgba(167,139,250,.12);color:var(--purple);}
.s-andamento{background:rgba(255,196,0,.1);color:var(--yellow);}
.s-finalizado{background:rgba(0,230,118,.1);color:var(--green);}
.s-pendente{background:rgba(167,139,250,.12);color:#c084fc;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg-full{grid-column:1/-1;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-label{font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
.f-input,.f-select,.f-textarea{background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:6px;font-size:13px;font-family:'Roboto',sans-serif;outline:none;width:100%;transition:border-color .2s;}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--accent);}
.f-input:disabled{opacity:.6;}
.f-textarea{resize:vertical;min-height:80px;}
.sep{height:1px;background:var(--border);margin:14px 0;}
.info-row{display:flex;gap:6px;font-size:12px;color:var(--text-dim);padding:3px 0;align-items:flex-start;}
.info-row strong{color:var(--text);min-width:110px;font-size:11px;flex-shrink:0;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid rgba(202,157,74,.2);border-radius:12px;width:100%;max-width:740px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 64px rgba(0,0,0,.6);}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:var(--border);}
.modal-head{padding:18px 22px;border-bottom:1px solid rgba(202,157,74,.2);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Roboto',sans-serif;font-weight:500;font-size:16px;letter-spacing:.3px;}
.modal-body{padding:22px;}
.modal-foot{padding:14px 22px;border-top:1px solid rgba(202,157,74,.15);display:flex;justify-content:flex-end;gap:8px;}

/* TIMELINE */
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border);}
.tl-item{position:relative;margin-bottom:18px;}
.tl-dot{position:absolute;left:-18px;top:3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg2);}
.tl-done{background:var(--green);}
.tl-curr{background:var(--yellow);box-shadow:0 0 8px var(--yellow);}
.tl-pend{background:var(--border);}
.tl-status{font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.tl-note{font-size:13px;color:var(--text);margin-bottom:3px;}
.tl-meta{font-size:11px;color:var(--text-muted);}
.tl-dur{font-size:10px;color:var(--yellow);background:rgba(255,196,0,.08);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:4px;}

/* USERS */
.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.user-card{background:var(--bg3);border:1px solid rgba(202,157,74,.1);border-radius:10px;padding:16px;}

/* LOGIN */
.login-page{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{background:var(--bg2);border:1px solid rgba(202,157,74,.25);border-radius:14px;padding:38px;width:420px;box-shadow:0 32px 64px rgba(0,0,0,.6);}
.login-logo{text-align:center;margin-bottom:16px;}
.login-logo img{height:50px;object-fit:contain;}
.login-sub{font-size:11px;color:var(--accent2);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:26px;font-weight:500;}
.login-err{background:rgba(255,61,87,.1);border:1px solid rgba(255,61,87,.3);border-radius:6px;padding:9px 13px;color:var(--red);font-size:13px;margin-bottom:14px;}


/* MISC */
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-muted);}
.upload-zone:hover{border-color:var(--accent);color:var(--text);background:var(--primary-dim);}
.img-previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.img-thumb{width:72px;height:54px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
.empty{text-align:center;padding:48px 0;color:var(--text-muted);}
.tag-strip{display:flex;gap:6px;flex-wrap:wrap;}

/* LOADING OVERLAY */
.loading-overlay{position:fixed;inset:0;background:rgba(10,13,22,.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loading-overlay img{height:50px;object-fit:contain;}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 1.5s infinite;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg2);border:1px solid rgba(202,157,74,.3);border-radius:8px;padding:10px 20px;font-size:13px;color:var(--text);z-index:9999;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

const fmtDate  = d => new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const timeDiff = (a,b) => {const ms=new Date(b)-new Date(a),h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return h>24?Math.floor(h/24)+'d '+h%24+'h':h>0?h+'h '+m+'min':m+'min';};
const statusClass = s => ({'Aberto':'s-aberto','Reconhecido':'s-reconhecido','Pendente':'s-pendente','Técnico Designado':'s-tecnico','Agendado':'s-agendado','Em Andamento':'s-andamento','Finalizado':'s-finalizado'}[s]||'s-aberto');
const effRole   = () => currentUser.role==='admin' ? viewAs : currentUser.role;
const openTks   = () => tickets.filter(t=>t.status!=='Finalizado');
const myTks     = () => currentUser.role==='tech' ? tickets.filter(t=>t.tech_id===currentUser.id) : tickets;
const techs     = () => USERS.filter(u=>u.role==='tech');
const getOnline  = () => manualStats!==null ? manualStats.online : CAMERAS.filter(c=>c.status==='online').length;
const getOffline = () => manualStats!==null ? manualStats.total-manualStats.online : CAMERAS.filter(c=>c.status==='offline').length;
const getTotal   = () => manualStats!==null ? manualStats.total : CAMERAS.length;
const makeAvatar = n => n.split(' ').filter((_,i,a)=>i===0||i===a.length-1).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'??';
const roleLabel  = r => r==='admin'?'Administrador':r==='tech'?'Técnico':'Cliente';
const roleClass  = r => r==='admin'?'s-tecnico':r==='tech'?'s-reconhecido':'s-finalizado';

function showToast(msg, dur=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}
function setLoading(show){
  const el=document.getElementById('loading-overlay');
  if(el) el.style.display = show ? 'flex' : 'none';
}

function openGps(lat,lng,name){
  const enc=encodeURIComponent(name);
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid=/Android/.test(navigator.userAgent);
  if(isIOS){ window.location.href=`maps://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`; setTimeout(()=>window.open(`https://maps.google.com/maps?daddr=${lat},${lng}`,'_blank'),500); }
  else if(isAndroid){ window.location.href=`geo:${lat},${lng}?q=${lat},${lng}(${enc})`; setTimeout(()=>window.open(`https://maps.google.com/maps?daddr=${lat},${lng}`,'_blank'),500); }
  else window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`,'_blank');
}

// ── INIT — load data from Supabase ────────────────────────────────────────────
async function init(){
  loadChartData();
  await loadManualStats();
  await loadOnuRegistros();
  setLoading(true);
  try {
    // Load users
    USERS = await sbGet('users','select=*&order=created_at.asc');
    // Load tickets with all fields
    const rawTks = await sbGet('tickets','select=*&order=created_at.desc');
    tickets = rawTks.map(normalizeTicket);
    // Cameras already loaded from KMZ; optionally sync from DB
    try {
      const dbCams = await sbGet('cameras','select=*&order=id.asc');
      if(dbCams && dbCams.length > 0) CAMERAS = dbCams.map(c=>({...c, model: c.model||'Intelbras/Hikvision'}));
    } catch(e){ /* use KMZ cameras */ }
    setLoading(false);
    render();
  } catch(err){
    console.error('Init error:', err);
    setLoading(false);
    // Fall back to offline demo mode
    USERS = [
      {id:'00000000-0000-0000-0000-000000000001',name:'Carlos Admin',email:'admin@segvision.com.br',phone:'(62) 99999-0001',role:'admin',password_hash:'admin123',avatar:'CA'},
      {id:'00000000-0000-0000-0000-000000000002',name:'Fernanda Cliente',email:'fernanda@cliente.com.br',phone:'(62) 98888-0002',role:'client',password_hash:'cliente123',avatar:'FC'},
      {id:'00000000-0000-0000-0000-000000000003',name:'Ricardo Técnico',email:'ricardo@segvision.com.br',phone:'(62) 97777-0003',role:'tech',password_hash:'tecnico123',avatar:'RT'},
    ];
    showToast('⚠ Modo offline — banco não conectado. Execute o SQL no Supabase.', 6000);
    render();
  }
}

function normalizeTicket(t){
  // Convert DB snake_case to app format
  return {
    id: t.id,
    title: t.title,
    cameraId: t.camera_id,
    status: t.status,
    priority: t.priority,
    requester: {name: t.requester_name, email: t.requester_email, phone: t.requester_phone},
    description: t.description,
    tech_id: t.tech_id,
    techId: t.tech_id,
    displacement: t.displacement,
    images: t.images||[],
    timeline: t.timeline||[],
    pendMotivo: t.pend_motivo||null,
    createdAt: t.created_at,
  };
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.style.display='none';
  const u = USERS.find(x => x.email===email && x.password_hash===pass);
  if(u){ currentUser=u; viewAs=u.role; render(); }
  else { errEl.textContent='E-mail ou senha inválidos.'; errEl.style.display='block'; }
}
function quickLogin(email){
  const u=USERS.find(x=>x.email===email);
  if(u){ currentUser=u; viewAs=u.role; render(); }
}
function doLogout(){ currentUser=null; leafletMap=null; render(); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('root').innerHTML = currentUser ? renderShell() : renderLogin();
  bindKeys();
  if(page==='dashboard'||page==='cameras'){
    requestAnimationFrame(initMap);
  } else if(page==='campo'&&campoSubPage==='troca-onu-form'){
    requestAnimationFrame(initOnuMiniMap);
  }
  if(page==='dashboard'||page==='cameras'){
    window.onresize = ()=>{ if(leafletMap) leafletMap.invalidateSize({animate:false}); };
    // Fix map on content scroll (Leaflet doesn't auto-detect container scroll)
    const contentEl = document.querySelector('.content');
    if(contentEl){
      contentEl.onscroll = ()=>{ if(leafletMap) leafletMap.invalidateSize({animate:false}); };
    }
  }
}

function renderPage(){
  if(page==='dashboard') return renderDashboard();
  if(page==='cameras')   return renderCameras();
  if(page==='tickets')   return renderTickets();
  if(page==='users')     return renderUsers();
  if(page==='grafico')   return renderGrafico();
  if(page==='campo')     return renderCampo();
  return '';
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  const er=effRole();
  const on=getOnline(),off=getOffline(),tot=CAMERAS.length,pct=Math.round(on/tot*100);
  const tks=er==='tech'?myTks():tickets;
  return `
  ${er==='admin'?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">

// ── MAP ───────────────────────────────────────────────────────────────────────
function initMap(){
  const mapDiv = document.getElementById('leaflet-map');
  if(!mapDiv) return;

  // If map already exists just refresh markers
  if(leafletMap){
    leafletMap.invalidateSize({animate:false});
    renderMapMarkers();
    return;
  }

  // Create map inside the existing div
  leafletMap = L.map('leaflet-map',{
    center:[-16.6869,-49.2648],
    zoom:13,
    zoomControl:true,
    preferCanvas:true,
  });

  // OSM tiles with retry
  const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19,
    keepBuffer:8,
    updateWhenIdle:false,
    updateWhenZooming:false,
  });
  tileLayer.on('tileerror', function(e){
    const tile = e.tile;
    if(!tile._retried){
      tile._retried = true;
      setTimeout(()=>{ tile.src = tile.src.split('?')[0]+'?r='+Date.now(); }, 2000);
    }
  });
  tileLayer.addTo(leafletMap);

  markersLayer = L.layerGroup().addTo(leafletMap);
  renderMapMarkers();
}



function fixMap(){
  [100, 300, 600].forEach(d => setTimeout( d));
}


function makeMarkerIcon(status){
  const color=status==='online'?'#00e676':'#ff3d57';
  const glow=status==='online'?'rgba(0,230,118,0.7)':'rgba(255,61,87,0.7)';
  return L.divIcon({className:'',html:`<div style="filter:drop-shadow(0 0 4px ${glow})"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${color}" opacity="0.2"/><circle cx="10" cy="10" r="5.5" fill="${color}"/><circle cx="10" cy="10" r="2.5" fill="#0a0d16"/></svg></div>`,iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-12]});
}
function renderMapMarkers(){
  if(!markersLayer) return;
  markersLayer.clearLayers();
  let list=CAMERAS;
  if(mapFilter==='online') list=list.filter(c=>c.status==='online');
  if(mapFilter==='offline') list=list.filter(c=>c.status==='offline');
  if(mapSearch){const q=mapSearch.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.address.toLowerCase().includes(q));}
  const er=effRole();
  list.forEach(cam=>{
    const marker=L.marker([cam.lat,cam.lng],{icon:makeMarkerIcon(cam.status)});
    const sc=cam.status==='online'?'pop-on':'pop-off';
    const ticketBtn=(er==='admin'||er==='client')&&cam.status==='offline'
      ?`<button class="pop-btn pop-btn-primary" onclick="selectedCam=CAMERAS.find(c=>c.id===${cam.id});openNewTicket()">🎫 Abrir Chamado</button>`
      :`<button class="pop-btn pop-btn-ghost">✓ Operacional</button>`;
    marker.bindPopup(`
      <div class="pop-inner">
        <div class="pop-head"><div class="pop-name">${cam.name}</div><span class="pop-badge ${sc}">${cam.status}</span></div>
        <div class="pop-addr">📍 ${cam.address}</div>
        <div class="pop-row"><strong>IP:</strong><span>${cam.ip||'—'}</span></div>
        <div class="pop-row"><strong>Modelo:</strong><span style="font-family:inherit;color:var(--text-dim)">${cam.model||'—'}</span></div>
      </div>
      <div class="pop-foot">
        <button class="pop-btn" style="background:var(--gold-grad);color:#0a0d16;font-weight:700" onclick="openGps(${cam.lat},${cam.lng},'${cam.name}')">🧭 Navegar até a Câmera</button>
        <div class="pop-btn-row">${ticketBtn}<button class="pop-btn pop-btn-ghost" onclick="openCamHistory(${cam.id})">📋 Histórico</button></div>
      </div>`,{maxWidth:260,minWidth:240});
    marker.on('click',()=>{
      selectedCam=cam;
      const bar=document.getElementById('map-info-bar');
      if(!bar) return;
      const _tb=(er==='admin'||er==='client')&&cam.status==='offline'
        ?'<button class="btn btn-danger btn-sm" onclick="selectedCam=CAMERAS.find(c=>c.id==='+cam.id+');openNewTicket()">🎫 Chamado</button>':'';
      bar.innerHTML='<span class="mib-item"><strong>'+cam.name+'</strong></span>'
        +'<span class="mib-item">📍 '+cam.address+'</span>'
        +'<span class="mib-item" style="font-family:monospace;color:var(--accent)">'+cam.ip+'</span>'
        +'<span class="mib-item"><span class="badge '+(cam.status==='online'?'cc-online':'cc-offline')+'">'+cam.status+'</span></span>'
        +'<span style="margin-left:auto;display:flex;gap:6px">'
        +'<button class="btn btn-ghost btn-sm" onclick="openCamHistory('+cam.id+')">📋 Histórico</button>'
        +'<button class="btn btn-sm" style="background:var(--gold-grad);color:#0a0d16;font-weight:700" onclick="openGps('+cam.lat+','+cam.lng+',\'gps\')">🧭 GPS</button>'
        +_tb+'</span>';
    });
    markersLayer.addLayer(marker);
  });
}

        ${cam?`<div style="margin-top:12px"><button class="btn btn-sm" style="background:var(--gold-grad);color:#0a0d16;font-weight:700" onclick="openGps(${cam.lat},${cam.lng},'${cam.name}')">${IC.nav} Navegar até a Câmera</button></div>`:''}
        <div class="sep"></div>
        <div style="font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Descrição</div>
        <p style="font-size:13px;color:var(--text);line-height:1.6">${t.description}</p>
        ${renderTicketActions(t,isAdmin,isTech)}
      </div>
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">Linha do Tempo</div>
        <div class="timeline">
          ${(t.timeline||[]).map((e,i)=>{
            const isLast=i===t.timeline.length-1;
            const next=t.timeline[i+1];
            const dur=next?timeDiff(e.date,next.date):null;
            const dot=t.status==='Finalizado'?'tl-done':isLast?'tl-curr':'tl-done';
            return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="tl-status">${e.status}</div><div class="tl-note">${e.note}</div><div class="tl-meta">por ${e.user} · ${fmtDate(e.date)}</div>${dur?`<div class="tl-dur">⏱ ${dur} nesta etapa</div>`:''}</div>`;
          }).join('')}
          ${t.status!=='Finalizado'?`<div class="tl-item" style="opacity:.35"><div class="tl-dot tl-pend"></div><div class="tl-status">${STATUS_FLOW[STATUS_FLOW.indexOf(t.status)+1]||'—'}</div><div class="tl-note" style="color:var(--text-muted)">Aguardando...</div></div>`:''}
        </div>
      </div>
    </div>
  </div></div>`;
}

// ── CAMERA HISTORY MODAL ──────────────────────────────────────────────────────
let CAM_HISTORY={};
function buildCamHistory(){
  CAM_HISTORY={};
  tickets.filter(t=>t.status==='Finalizado').forEach(t=>{
    const cid=t.cameraId||t.camera_id;
    if(!CAM_HISTORY[cid]) CAM_HISTORY[cid]=[];
    const last=t.timeline[t.timeline.length-1];
    const tech=USERS.find(u=>u.id===(t.techId||t.tech_id));
    const note=last?.note||'';
    const causeMatch=note.match(/Causa: (.+?) \| Solução:/);
    const solMatch=note.match(/Solução: (.+)$/);
    CAM_HISTORY[cid].push({ticketId:t.id,date:last?.date||t.createdAt,techName:tech?.name||'Não informado',techAvatar:tech?.avatar||'??',cause:causeMatch?causeMatch[1]:note,solution:solMatch?solMatch[1]:'',priority:t.priority,images:t.images||[],duration:t.timeline.length>1?timeDiff(t.timeline[0].date,last.date):'—'});
  });
  Object.keys(CAM_HISTORY).forEach(k=>CAM_HISTORY[k].sort((a,b)=>new Date(b.date)-new Date(a.date)));
}
function openCamHistory(camId){buildCamHistory();camHistoryId=camId;showModal(renderCamHistoryModal());}
function closeCamHistory(){camHistoryId=null;hideModal();}

          </div>
          ${v.images&&v.images.length>0?`<div style="padding:0 16px 14px"><div style="font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Fotos (${v.images.length})</div><div class="img-previews">${v.images.map(img=>`<img src="${img}" class="img-thumb" onclick="previewImg='${img}';render()"/>`).join('')}</div></div>`:''}
        </div>`).join('')}
      </div>`}
    </div>
    <div class="modal-foot" style="justify-content:space-between">

function handleKmzFile(file){
  if(!file) return;
  importState={status:'loading',log:['📂 '+file.name+' ('+( file.size/1024).toFixed(1)+' KB)'],cameras:null};
  render();
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      let kmlText='';
      if(file.name.toLowerCase().endsWith('.kmz')){
        importState.log.push('📦 Descompactando...');
        const zip=await JSZip.loadAsync(e.target.result);
        const kmlFile=zip.file(/\.kml$/i)[0];
        if(!kmlFile) throw new Error('Nenhum .kml encontrado');
        kmlText=await kmlFile.async('text');
        importState.log.push('✓ KML extraído');
      } else { kmlText=new TextDecoder().decode(e.target.result); }
      importState.log.push('🔍 Analisando marcadores...');
      const cameras=parseKml(kmlText);
      if(!cameras||cameras.length===0) throw new Error('Nenhum marcador encontrado');
      importState.log.push('✓ '+cameras.length+' câmeras encontradas');
      importState.status='preview'; importState.cameras=cameras; render();
    } catch(err){ importState.status='error'; importState.log.push('❌ '+err.message); render(); }
  };
  reader.onerror=()=>{importState.status='error';importState.log.push('❌ Erro ao ler');render();};
  reader.readAsArrayBuffer(file);
}
function parseKml(kmlText){
  const doc = new DOMParser().parseFromString(kmlText,'text/xml');

  // Step 1: Build style color map from <Style> elements
  // Check icon href URL for color clues
  const styleColors = {};
  doc.querySelectorAll('Style').forEach(s => {
    const id = s.getAttribute('id') || '';
    const href = (s.querySelector('IconStyle href, href')?.textContent || '').toLowerCase();
    const color = (s.querySelector('IconStyle color, color')?.textContent || '').toLowerCase();

    let status = null;

    // Check by style id name patterns
    if(/offline|red|vermelho|ci-1|icon-1|deslig/i.test(id)) status = 'offline';
    else if(/online|green|verde|ci-2|icon-2|lig/i.test(id)) status = 'online';

    // Check by icon href URL content
    if(!status){
      if(/red|ff0000|e51c23|f44336|vermelho/i.test(href)) status = 'offline';
      else if(/green|00e676|4caf50|verde|0f9d58/i.test(href)) status = 'online';
    }

    // Check by KML color value (AABBGGRR format - red = FF0000FF -> last bytes)
    if(!status && color){
      // KML color is AABBGGRR
      // Red: low R bytes (last 2 chars), high B bytes
      // Green: high G bytes (middle), low R bytes
      if(color.endsWith('ff') && color.startsWith('ff00')) status = 'offline'; // blue-ish = offline
      if(/ff00(ff|[89a-f][0-9a-f])00/i.test(color)) status = 'online'; // green
    }

    if(status) styleColors['#'+id] = status;
  });

  // Step 2: Resolve <StyleMap> -> actual Style
  const styleMapResolve = {};
  doc.querySelectorAll('StyleMap').forEach(sm => {
    const smId = '#'+(sm.getAttribute('id')||'');
    // Get the 'normal' pair styleUrl
    const pairs = sm.querySelectorAll('Pair');
    pairs.forEach(pair => {
      const key = pair.querySelector('key')?.textContent?.trim();
      if(key === 'normal'){
        const url = pair.querySelector('styleUrl')?.textContent?.trim();
        if(url && styleColors[url]) styleMapResolve[smId] = styleColors[url];
      }
    });
    // Fallback: first pair
    if(!styleMapResolve[smId] && pairs.length > 0){
      const url = pairs[0].querySelector('styleUrl')?.textContent?.trim();
      if(url && styleColors[url]) styleMapResolve[smId] = styleColors[url];
    }
  });

  // Combined lookup: StyleMap id -> status OR Style id -> status
  const lookup = {...styleColors, ...styleMapResolve};

  // Step 3: Parse Placemarks
  const cameras = [];
  doc.querySelectorAll('Placemark').forEach((pm, i) => {
    const name = pm.querySelector('name')?.textContent?.trim() || 'Ponto '+(i+1);
    const styleUrl = pm.querySelector('styleUrl')?.textContent?.trim() || '';
    const coordStr = pm.querySelector('coordinates')?.textContent?.trim();
    if(!coordStr) return;

    const parts = coordStr.split(',');
    const lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
    if(isNaN(lat)||isNaN(lng)) return;

    // Determine status
    let status = lookup[styleUrl];
    if(!status){
      // Try direct id match without '#'
      const bare = styleUrl.replace('#','');
      status = Object.entries(lookup).find(([k])=>k.replace('#','')===bare)?.[1];
    }
    if(!status){
      // Last resort: check styleUrl string itself
      if(/offline|red|vermelho|ci-1|icon-1|deslig/i.test(styleUrl)) status = 'offline';
      else if(/online|green|verde|ci-2|icon-2|lig/i.test(styleUrl)) status = 'online';
      else status = 'offline'; // CHANGED: default to offline (safer than showing wrong green)
    }

    const nameParts = name.split(' - ');
    const pnum = nameParts[0].replace('Ponto','').trim();
    const addr = nameParts.length > 1 ? nameParts.slice(1).join(' - ') : name;

    cameras.push({
      id: i+1,
      name: 'CAM-'+String(pnum).padStart(3,'0'),
      address: addr, lat, lng, status,
      ip: '192.168.'+(Math.floor(i/254)+1)+'.'+(i%254+1),
      model: 'Intelbras/Hikvision',
      location: addr
    });
  });

  console.log('=== KMZ DEBUG ===');
  console.log('Total cameras:', cameras.length);
  console.log('Online (green):', cameras.filter(c=>c.status==='online').length);
  console.log('Offline (red):', cameras.filter(c=>c.status==='offline').length);
  console.log('Style colors detected:', styleColors);
  console.log('StyleMap resolved:', styleMapResolve);
  console.log('Full lookup:', lookup);
  // Log first 5 placemarks with their styleUrl
  doc.querySelectorAll('Placemark').forEach((pm,i)=>{
    if(i>=5) return;
    const styleUrl = pm.querySelector('styleUrl')?.textContent?.trim()||'';
    const name = pm.querySelector('name')?.textContent?.trim()||'';
    console.log('Placemark', i, ':', name, '| styleUrl:', styleUrl, '| resolved:', lookup[styleUrl]||'NOT FOUND');
  });
  // Log all raw Style elements
  console.log('--- Raw Styles ---');
  doc.querySelectorAll('Style').forEach(s=>{
    const id = s.getAttribute('id')||'';
    const href = s.querySelector('IconStyle href, href')?.textContent||'';
    const color = s.querySelector('IconStyle color, color')?.textContent||'';
    console.log('Style:', id, '| href:', href.substring(0,80), '| color:', color);
  });
  console.log('--- Raw StyleMaps ---');
  doc.querySelectorAll('StyleMap').forEach(sm=>{
    const id = sm.getAttribute('id')||'';
    const pairs = [...sm.querySelectorAll('Pair')].map(p=>p.querySelector('key')?.textContent+':'+p.querySelector('styleUrl')?.textContent).join(', ');
    console.log('StyleMap:', id, '|', pairs);
  });
  console.log('=================');

  return cameras;
}
async function applyImport(){
  if(!importState.cameras||!importState.cameras.length) return;
  CAMERAS.length=0;
  importState.cameras.forEach(c=>CAMERAS.push(c));
  // Sync to Supabase
  try {
    setLoading(true);
    // Use UPSERT (merge-duplicates) - no delete needed, avoids foreign key conflicts
    const chunks=[];
    for(let i=0;i<CAMERAS.length;i+=50) chunks.push(CAMERAS.slice(i,i+50));
    for(const chunk of chunks){
      const resp = await fetch(`${SB_URL}/rest/v1/cameras`, {
        method:'POST',
        headers:{
          ...SB_HEADERS,
          'Prefer':'return=minimal,resolution=merge-duplicates'
        },
        body: JSON.stringify(chunk.map(c=>({
          id:c.id, name:c.name, address:c.address,
          lat:c.lat, lng:c.lng, status:c.status,
          ip:c.ip, model:c.model, location:c.location
        })))
      });
      if(!resp.ok){ const t=await resp.text(); throw new Error('Upsert: HTTP '+resp.status+' '+t.substring(0,100)); }
    }
    setLoading(false);
    showToast('✓ '+CAMERAS.length+' câmeras sincronizadas com o banco!');
  } catch(e){
    setLoading(false);
    console.error('applyImport error:', e.message);
    showToast('⚠ Erro ao sincronizar: '+e.message.substring(0,80), 6000);
  }
  leafletMap=null; markersLayer=null;
  importState.status='done'; render();
}

async function advanceTicket(id,status,note,extra){
  const t=tickets.find(x=>x.id===id); if(!t) return;
  const newEntry={status,date:new Date().toISOString(),user:currentUser.name,note};
  const newTimeline=[...(t.timeline||[]),newEntry];
  try {
    // Map pendMotivo -> pend_motivo for DB
    const dbExtra = {...extra};
    if('pendMotivo' in dbExtra){ dbExtra.pend_motivo = dbExtra.pendMotivo; delete dbExtra.pendMotivo; }
    // Only include pend_motivo if explicitly set (avoid column not found errors)
    const patchBody = {status, timeline:newTimeline, updated_at:new Date().toISOString()};
    if(dbExtra.tech_id !== undefined) patchBody.tech_id = dbExtra.tech_id;
    if(dbExtra.displacement !== undefined) patchBody.displacement = dbExtra.displacement;
    if(dbExtra.images !== undefined) patchBody.images = dbExtra.images;
    if(dbExtra.pend_motivo !== undefined) patchBody.pend_motivo = dbExtra.pend_motivo;
    console.log('PATCH tickets id='+id, JSON.stringify(patchBody).substring(0,200));
    await sbPatch('tickets','id=eq.'+id, patchBody);
    tickets=tickets.map(tk=>tk.id!==id?tk:{...tk,status,...extra,timeline:newTimeline,pendMotivo:extra.pendMotivo!==undefined?extra.pendMotivo:tk.pendMotivo});
    showToast('✓ Ticket atualizado');
  } catch(e){
    tickets=tickets.map(tk=>tk.id!==id?tk:{...tk,status,...extra,timeline:newTimeline,pendMotivo:extra.pendMotivo!==undefined?extra.pendMotivo:tk.pendMotivo});
    const errMsg = e.message||'Erro desconhecido';
    console.error('ERRO SUPABASE:', errMsg);
    showToast('⚠ Salvo localmente — Erro: '+errMsg.substring(0,80), 6000);
  }
  openTicketId=id; showModal(renderTicketModal());
}

async function saveUser(id){
  const name=document.getElementById('um-name').value.trim();
  const email=document.getElementById('um-email').value.trim();
  const phone=document.getElementById('um-phone').value.trim();
  const role=document.getElementById('um-role').value;
  const pass=document.getElementById('um-pass').value;
  const pass2=document.getElementById('um-pass2').value;
  const errEl=document.getElementById('um-error');
  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  errEl.style.display='none';
  if(!name) return showErr('Nome obrigatório.');
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('E-mail inválido.');
  const isNew=id===null;
  if(isNew&&!pass) return showErr('Senha obrigatória.');
  if(pass&&pass.length<6) return showErr('Mínimo 6 caracteres.');
  if(pass&&pass!==pass2) return showErr('Senhas não coincidem.');
  if(USERS.find(u=>u.email===email&&u.id!==id)) return showErr('E-mail já cadastrado.');
  const avatar=makeAvatar(name);
  try {
    if(isNew){
      const [saved]=await sbPost('users',{name,email,phone,role,password_hash:pass,avatar});
      USERS=[...USERS,saved];
    } else {
      const upd={name,email,phone,role,avatar};
      if(pass) upd.password_hash=pass;
      const [saved]=await sbPatch('users','id=eq.'+id,upd);
      USERS=USERS.map(u=>u.id!==id?u:{...u,...saved});
      if(currentUser.id===id) currentUser=USERS.find(u=>u.id===id);
    }
    showToast('✓ Usuário salvo!');
  } catch(e){
    if(isNew) USERS=[...USERS,{id:'local-'+Date.now(),name,email,phone,role,password_hash:pass,avatar}];
    else USERS=USERS.map(u=>u.id!==id?u:{...u,name,email,phone,role,avatar,...(pass?{password_hash:pass}:{})});
    showToast('⚠ Salvo localmente');
  }
  hideModal(); if(page==='users') render();
}

async function saveNewPassword(){
  const current = document.getElementById('cp-current').value;
  const newPw   = document.getElementById('cp-new').value;
  const confirm = document.getElementById('cp-confirm').value;
  const errEl   = document.getElementById('cp-error');
  const sucEl   = document.getElementById('cp-success');

  const showErr = msg => { errEl.textContent=msg; errEl.style.display='block'; sucEl.style.display='none'; };
  errEl.style.display='none'; sucEl.style.display='none';

  // Validate current password
  if(current !== currentUser.password_hash) return showErr('Senha atual incorreta.');
  if(!newPw)                                return showErr('Digite a nova senha.');
  if(newPw.length < 6)                      return showErr('A nova senha deve ter pelo menos 6 caracteres.');
  if(newPw !== confirm)                     return showErr('As senhas não coincidem.');
  if(newPw === current)                     return showErr('A nova senha deve ser diferente da atual.');

  try {
    await sbPatch('users', 'id=eq.'+currentUser.id, {password_hash: newPw});
    // Update local state
    currentUser = {...currentUser, password_hash: newPw};
    USERS = USERS.map(u => u.id===currentUser.id ? {...u, password_hash: newPw} : u);
    sucEl.style.display='block';
    // Clear fields
    document.getElementById('cp-current').value='';
    document.getElementById('cp-new').value='';
    document.getElementById('cp-confirm').value='';
    // Close after 2 seconds
    setTimeout(()=>{ showChangePassword=false; hideModal(); }, 2000);
  } catch(e) {
    showErr('Erro ao salvar. Tente novamente.');
  }
}

function getChartProjection(){
  const filled = chartData.filter(d=>d.online!==null);
  if(filled.length < 2) return null;
  // Simple linear regression on last 14 days of data
  const recent = filled.slice(-14);
  const n = recent.length;
  const indices = recent.map((_,i)=>i);
  const values  = recent.map(d=>d.online);
  const meanX = indices.reduce((a,b)=>a+b,0)/n;
  const meanY = values.reduce((a,b)=>a+b,0)/n;
  const num = indices.reduce((s,x,i)=>s+(x-meanX)*(values[i]-meanY),0);
  const den = indices.reduce((s,x)=>s+(x-meanX)**2,0);
  const slope = den!==0 ? num/den : 0;
  const intercept = meanY - slope*meanX;
  // Project next 30 days from last filled day
  const lastIdx = chartData.findIndex(d=>d.date===filled[filled.length-1].date);
  const projection = [];
  const total = getTotal();
  for(let i=1;i<=30;i++){
    const dayIdx = lastIdx+i;
    if(dayIdx>=chartData.length) break;
    const projected = Math.round(intercept + slope*(n-1+i));
    const clamped = Math.max(0,Math.min(total,projected));
    projection.push({date:chartData[dayIdx].date, online:clamped});
  }
  return projection;
}

    <div style="font-size:12px;margin-top:6px">Preencha os valores na tabela abaixo para ver o gráfico</div>
  </div>`;

  // Combine filled + projection for x axis
  const allPoints = [...filled, ...(projection||[])];
  const minDate = new Date(allPoints[0].date+'T12:00:00');
  const maxDate = new Date(allPoints[allPoints.length-1].date+'T12:00:00');
  const dateRange = (maxDate-minDate)||1;

  const xOf = d => PAD.left + ((new Date(d+'T12:00:00')-minDate)/dateRange)*cW;
  const yOf = v => PAD.top + cH - (v/total)*cH;

  // Build SVG paths
  let onlinePath='', offlinePath='', projPath='', projOffPath='';
  filled.forEach((d,i)=>{
    const x=xOf(d.date), y=yOf(d.online), yo=yOf(total-d.online);
    onlinePath  += (i===0?`M${x},${y}`:`L${x},${y}`);
    offlinePath += (i===0?`M${x},${yo}`:`L${x},${yo}`);
  });
  if(projection&&projection.length){
    const startX=xOf(filled[filled.length-1].date);
    const startY=yOf(filled[filled.length-1].online);
    const startYO=yOf(total-filled[filled.length-1].online);
    projPath    = `M${startX},${startY}`;
    projOffPath = `M${startX},${startYO}`;
    projection.forEach(d=>{
      projPath    += `L${xOf(d.date)},${yOf(d.online)}`;
      projOffPath += `L${xOf(d.date)},${yOf(total-d.online)}`;
    });
  }

  // Y axis ticks
  const yTicks = [0,25,50,75,100].map(pct=>Math.round(total*pct/100));
  // X axis labels (monthly)
  const xLabels=[];
  let cur=new Date(minDate); cur.setDate(1);
  while(cur<=maxDate){
    if(cur>=minDate){
      const label=['Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][cur.getMonth()-1]||'';
      xLabels.push({x:xOf(cur.toISOString().split('T')[0]),label});
    }
    cur.setMonth(cur.getMonth()+1);
  }

  return `<div style="background:var(--bg3);border:1px solid rgba(202,157,74,.12);border-radius:10px;padding:16px;overflow-x:auto">
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <div style="font-size:13px;font-weight:500;color:var(--text)">Evolução ${new Date(filled[0].date+'T12:00:00').toLocaleDateString('pt-BR')} → ${new Date(filled[filled.length-1].date+'T12:00:00').toLocaleDateString('pt-BR')}</div>
      <div style="display:flex;gap:12px;margin-left:auto;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px"><div style="width:20px;height:2px;background:var(--green)"></div>Online</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px"><div style="width:20px;height:2px;background:var(--red)"></div>Offline</div>
        ${projection&&projection.length?`<div style="display:flex;align-items:center;gap:5px;font-size:11px"><div style="width:20px;height:2px;background:var(--purple);border-top:2px dashed var(--purple)"></div>Projeção Online</div>`:''}
      </div>
    </div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible;max-width:100%">
      <!-- Grid lines -->
      ${yTicks.map(v=>`<line x1="${PAD.left}" y1="${yOf(v)}" x2="${W-PAD.right}" y2="${yOf(v)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`).join('')}
      <!-- Y labels -->
      ${yTicks.map(v=>`<text x="${PAD.left-6}" y="${yOf(v)+4}" text-anchor="end" font-size="10" fill="#445577" font-family="Roboto,sans-serif">${v}</text>`).join('')}
      <!-- X labels -->
      ${xLabels.map(l=>`<text x="${l.x}" y="${H-6}" text-anchor="middle" font-size="10" fill="#445577" font-family="Roboto,sans-serif">${l.label}</text>`).join('')}
      <!-- Filled area online -->
      <path d="${onlinePath}L${xOf(filled[filled.length-1].date)},${yOf(0)}L${xOf(filled[0].date)},${yOf(0)}Z" fill="rgba(0,230,118,0.08)"/>
      <!-- Filled area offline -->
      
      <!-- Online line -->
      <path d="${onlinePath}" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Offline line -->
      
      <!-- Projection lines -->
      ${projPath?`<path d="${projPath}" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>`:''}
      <!-- Data points (last 30 days) -->
      ${filled.slice(-30).map(d=>`<circle cx="${xOf(d.date)}" cy="${yOf(d.online)}" r="3" fill="#00e676" stroke="var(--bg3)" stroke-width="1.5"/>`).join('')}
      <!-- Today line -->
      ${filled.find(d=>d.date===new Date().toISOString().split('T')[0])?`<line x1="${xOf(new Date().toISOString().split('T')[0])}" y1="${PAD.top}" x2="${xOf(new Date().toISOString().split('T')[0])}" y2="${H-PAD.bottom}" stroke="rgba(202,157,74,0.4)" stroke-width="1" stroke-dasharray="3,3"/><text x="${xOf(new Date().toISOString().split('T')[0])}" y="${PAD.top-4}" text-anchor="middle" font-size="9" fill="var(--accent)" font-family="Roboto,sans-serif">HOJE</text>`:''}
      <!-- Meta line: 209 cameras -->
      <line x1="${PAD.left}" y1="${yOf(209)}" x2="${W-PAD.right}" y2="${yOf(209)}" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
      <text x="${W-PAD.right+4}" y="${yOf(209)+4}" font-size="11" fill="#fbbf24" font-family="Roboto,sans-serif" font-weight="600">META 209</text>
      <rect x="${PAD.left}" y="${yOf(209)-11}" width="50" height="14" rx="3" fill="rgba(251,191,36,0.12)"/>
      <text x="${PAD.left+4}" y="${yOf(209)+1}" font-size="10" fill="#fbbf24" font-family="Roboto,sans-serif" font-weight="600">209</text>
      <!-- Axes -->
      <line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${H-PAD.bottom}" stroke="#1e2a3a" stroke-width="1"/>
      <line x1="${PAD.left}" y1="${H-PAD.bottom}" x2="${W-PAD.right}" y2="${H-PAD.bottom}" stroke="#1e2a3a" stroke-width="1"/>
    </svg>
  </div>`;
}

function updateChartDay(date, value){
  const v = value===''||value===null ? null : Math.max(0,Math.min(getTotal(),parseInt(value)||0));
  chartData = chartData.map(d=>d.date===date?{...d,online:v}:d);
  saveChartData();
  // Refresh only the chart content without full render
  const content = document.querySelector('.content');
  if(content && page==='grafico'){
    content.innerHTML = renderGrafico();
  }
}


function renderDashboardChart(){
  const filled     = chartData.filter(d=>d.online!==null);
  const projection = getChartProjection();
  const total      = getTotal();
  if(filled.length===0) return '';

  const recent  = filled.slice(-60);
  const today   = new Date().toISOString().split('T')[0];
  const last    = recent[recent.length-1];
  const avgOnline = Math.round(filled.reduce((s,d)=>s+d.online,0)/filled.length);
  const trend   = filled.length>=2 ? filled[filled.length-1].online - filled[filled.length-2].online : 0;

  const W=1060,H=220,PAD={top:20,right:20,bottom:40,left:50};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;

  const allPts = [...recent,...(projection||[])];
  const minDate= new Date(allPts[0].date+'T12:00:00');
  const maxDate= new Date(allPts[allPts.length-1].date+'T12:00:00');
  const dRange = (maxDate-minDate)||1;

  const xOf = d => PAD.left+((new Date(d+'T12:00:00')-minDate)/dRange)*cW;
  const yOf = v => PAD.top+cH-(v/total)*cH;

  let onlinePath='', offlinePath='', projPath='';
  recent.forEach((d,i)=>{
    const x=xOf(d.date);
    onlinePath  += (i===0?`M${x},${yOf(d.online)}`:`L${x},${yOf(d.online)}`);
    offlinePath += (i===0?`M${x},${yOf(total-d.online)}`:`L${x},${yOf(total-d.online)}`);
  });
  if(projection&&projection.length){
    projPath=`M${xOf(recent[recent.length-1].date)},${yOf(recent[recent.length-1].online)}`;
    projection.forEach(d=>{ projPath+=`L${xOf(d.date)},${yOf(d.online)}`; });
  }

  // X axis date labels — show first day of each week
  const xLabels=[];
  recent.forEach((d,i)=>{
    const dt=new Date(d.date+'T12:00:00');
    if(i===0||dt.getDay()===1||i===recent.length-1){
      const dd=String(dt.getDate()).padStart(2,'0');
      const mm=String(dt.getMonth()+1).padStart(2,'0');
      xLabels.push({x:xOf(d.date), label:`${dd}/${mm}`});
    }
  });

  // Interactive points data as JSON for mouseover
  const pointsData = recent.map(d=>({
    date:d.date, online:d.online, offline:total-d.online,
    pct:Math.round(d.online/total*100),
    x:Math.round(xOf(d.date)), y:Math.round(yOf(d.online)),
    yo:Math.round(yOf(total-d.online))
  }));
  const chartId = 'chart_'+Date.now();

  return `<div class="card" style="margin-bottom:20px">
    <div class="card-header">
      <div class="card-title">📈 Evolução de Câmeras</div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--text-muted)">Último: <strong style="color:var(--green)">${last.online} online</strong> · <strong style="color:var(--red)">${total-last.online} offline</strong></span>
        <span style="font-size:12px;color:var(--text-muted)">Média: <strong style="color:var(--accent)">${avgOnline}</strong></span>
        <span style="font-size:12px;color:${trend>=0?'var(--green)':'var(--red)'}">${trend>=0?'▲':'▼'} ${Math.abs(trend)} vs ontem</span>
        <a onclick="goPage('grafico')" style="font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline">Ver detalhes →</a>
      </div>
    </div>
    <div style="padding:12px 16px 4px;overflow-x:auto">
      <div style="display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)"><div style="width:16px;height:2px;background:var(--green)"></div>Online</div>
        ${projection&&projection.length?'<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)"><div style="width:16px;height:2px;border-top:2px dashed var(--purple)"></div>Projeção</div>':''}
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#fbbf24"><div style="width:16px;height:0;border-top:1.5px dashed #fbbf24"></div>Meta (209)</div>
        <div id="${chartId}_tooltip" style="display:none;background:var(--bg2);border:1px solid rgba(202,157,74,.3);border-radius:8px;padding:8px 12px;font-size:12px;margin-left:auto;min-width:200px"></div>
      </div>
      <svg id="${chartId}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;overflow:visible;cursor:crosshair"
        onmouseleave="document.getElementById('${chartId}_tooltip').style.display='none';document.getElementById('${chartId}_cursor').style.display='none'">
        <!-- Grid -->
        ${[0,0.25,0.5,0.75,1].map(p=>{
          const v=Math.round(total*p);
          return `<line x1="${PAD.left}" y1="${yOf(v)}" x2="${W-PAD.right}" y2="${yOf(v)}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <text x="${PAD.left-4}" y="${yOf(v)+4}" text-anchor="end" font-size="10" fill="#445577" font-family="Roboto,sans-serif">${v}</text>`;
        }).join('')}
        <!-- X labels -->
        ${xLabels.map(l=>`<text x="${l.x}" y="${H-6}" text-anchor="middle" font-size="10" fill="#445577" font-family="Roboto,sans-serif">${l.label}</text>`).join('')}
        <!-- Areas -->
        <path d="${onlinePath}L${xOf(recent[recent.length-1].date)},${yOf(0)}L${xOf(recent[0].date)},${yOf(0)}Z" fill="rgba(0,230,118,0.07)"/>
        
        <!-- Lines -->
        <path d="${onlinePath}"  fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        
        ${projPath?`<path d="${projPath}" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>`:''}
        <!-- Cursor line (hidden by default) -->
        <line id="${chartId}_cursor" x1="0" y1="${PAD.top}" x2="0" y2="${H-PAD.bottom}" stroke="rgba(202,157,74,0.4)" stroke-width="1" stroke-dasharray="3,3" display="none"/>
        <!-- Today marker -->
        ${recent.find(d=>d.date===today)?`<line x1="${xOf(today)}" y1="${PAD.top}" x2="${xOf(today)}" y2="${H-PAD.bottom}" stroke="rgba(202,157,74,0.35)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${xOf(today)}" y="${PAD.top-4}" text-anchor="middle" font-size="9" fill="var(--accent)" font-family="Roboto,sans-serif">HOJE</text>`:''}
        <!-- Interactive overlay rectangles per data point -->
        ${pointsData.map((p,i)=>{
          const nextX = i<pointsData.length-1 ? pointsData[i+1].x : W-PAD.right;
          const prevX = i>0 ? pointsData[i-1].x : PAD.left;
          const rx = Math.round((p.x+prevX)/2);
          const rw = Math.round((nextX-prevX)/2);
          const dt = new Date(p.date+'T12:00:00');
          const fmtD = `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
          const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
          const dayN = dayNames[dt.getDay()];
          return `<rect x="${rx}" y="${PAD.top}" width="${rw}" height="${cH}" fill="transparent" 
            onmouseover="chartHover('${chartId}',${p.x},${p.y},${p.yo},${p.online},${p.offline},${p.pct},'${fmtD}','${dayN}')"
          />`;
        }).join('')}
        <!-- Dot indicators -->
        ${pointsData.filter((_,i)=>i%Math.max(1,Math.floor(pointsData.length/20))===0||i===pointsData.length-1).map(p=>`
          <circle cx="${p.x}" cy="${p.y}"  r="2.5" fill="#00e676" opacity="0.7"/>`).join('')}
        <!-- Meta 209 -->
        <line x1="${PAD.left}" y1="${yOf(209)}" x2="${W-PAD.right}" y2="${yOf(209)}" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
        <rect x="${PAD.left}" y="${yOf(209)-11}" width="42" height="14" rx="3" fill="rgba(251,191,36,0.15)"/>
        <text x="${PAD.left+4}" y="${yOf(209)+1}" font-size="9" fill="#fbbf24" font-family="Roboto,sans-serif" font-weight="700">209</text>
        <text x="${W-PAD.right-4}" y="${yOf(209)-4}" text-anchor="end" font-size="9" fill="#fbbf24" font-family="Roboto,sans-serif" font-weight="600">META</text>
        <!-- Axes -->
        <line x1="${PAD.left}" y1="${H-PAD.bottom}" x2="${W-PAD.right}" y2="${H-PAD.bottom}" stroke="#1e2a3a" stroke-width="1"/>
        <line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${H-PAD.bottom}" stroke="#1e2a3a" stroke-width="1"/>
      </svg>
    </div>
  </div>`;
}

function chartHover(chartId, x, y, yo, online, offline, pct, date, dayName){
  const cursor = document.getElementById(chartId+'_cursor');
  const tooltip = document.getElementById(chartId+'_tooltip');
  if(cursor){ cursor.setAttribute('x1',x); cursor.setAttribute('x2',x); cursor.style.display=''; cursor.removeAttribute('display'); }
  if(tooltip){
    const color = pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)';
    tooltip.style.display='block';
    tooltip.innerHTML=`
      <div style="font-weight:600;color:var(--text);margin-bottom:6px">${dayName}, ${date}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div><span style="color:var(--green);font-size:15px;font-weight:600">${online}</span><span style="color:var(--text-muted);font-size:11px"> online</span></div>
        <div><span style="color:var(--red);font-size:15px;font-weight:600">${offline}</span><span style="color:var(--text-muted);font-size:11px"> offline</span></div>
        <div><span style="color:${color};font-size:15px;font-weight:600">${pct}%</span><span style="color:var(--text-muted);font-size:11px"> disp.</span></div>
      </div>
    `;
  }
}

async function executeDeleteTicket(id){
  try {
    await sbDelete('tickets','id=eq.'+id);
    showToast('✓ Chamado excluído');
  } catch(e){
    showToast('⚠ Removido localmente');
  }
  tickets = tickets.filter(t=>t.id!==id);
  deleteTicketId = null;
  render();
}

async function saveManualStatsForm(){
  const total  = parseInt(document.getElementById('es-total').value);
  const online = parseInt(document.getElementById('es-online').value);
  const errEl  = document.getElementById('es-error');
  errEl.style.display='none';

  if(isNaN(total)||total<1)  return (errEl.textContent='Total inválido.', errEl.style.display='block');
  if(isNaN(online)||online<0) return (errEl.textContent='Online inválido.', errEl.style.display='block');
  if(online>total) return (errEl.textContent='Online não pode ser maior que o total.', errEl.style.display='block');

  manualStats = {total, online};
  showEditStats = false;
  showToast('💾 Salvando...');
  render();
  await saveManualStats();
  showToast('✓ Valores atualizados para todos os usuários!');
}

function initOnuMiniMap(){
  if(!onuMapMode) return;
  const el = document.getElementById('onu-mini-map');
  if(!el||el._mapInit) return;
  el._mapInit = true;
  const m = L.map('onu-mini-map',{center:[-16.6869,-49.2648],zoom:13});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(m);
  CAMERAS.forEach(cam=>{
    const ic=L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:'+(cam.status==='online'?'#00e676':'#ff3d57')+';border:2px solid #0a0d16;cursor:pointer"></div>',iconSize:[12,12],iconAnchor:[6,6]});
    L.marker([cam.lat,cam.lng],{icon:ic}).addTo(m).on('click',()=>selectOnuCam(cam.id));
  });
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      const ic2=L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#a78bfa;border:2px solid #fff;box-shadow:0 0 8px rgba(167,139,250,.6)"></div>',iconSize:[14,14],iconAnchor:[7,7]});
      L.marker([pos.coords.latitude,pos.coords.longitude],{icon:ic2}).addTo(m).bindPopup('Você está aqui');
      m.setView([pos.coords.latitude,pos.coords.longitude],15);
    });
  }
}

async function loadOnuRegistros(){
  try{
    const data = await sbGet('onu_registros','select=*&order=created_at.asc');
    onuRegistros = data.map(r=>({
      id: r.id,
      data: r.data||r.created_at,
      cameraId: r.camera_id,
      camera: r.camera,
      cameraAddr: r.camera_addr,
      modeloOnu: r.modelo_onu,
      sn: r.sn,
      mac: r.mac,
      ponSn: r.pon_sn,
      pin: r.pin||'',
      fotoAntiga: r.foto_antiga||null,
      fotoNova: r.foto_nova||null,
      tecnico: r.tecnico,
      tecnicoId: r.tecnico_id,
    }));
  } catch(e){
    // Fallback to localStorage
    try{ const s=localStorage.getItem('brilha_onu'); if(s) onuRegistros=JSON.parse(s); }catch(e2){}
  }
}
async function saveOnuRegistro(registro){
  // Save single record to Supabase
  try{
    await sbPost('onu_registros', {
      id: registro.id,
      data: registro.data,
      camera_id: registro.cameraId,
      camera: registro.camera,
      camera_addr: registro.cameraAddr,
      modelo_onu: registro.modeloOnu,
      sn: registro.sn,
      mac: registro.mac,
      pon_sn: registro.ponSn,
      pin: registro.pin||'',
      foto_antiga: registro.fotoAntiga||null,
      foto_nova: registro.fotoNova||null,
      tecnico: registro.tecnico,
      tecnico_id: registro.tecnicoId,
    });
    return true;
  } catch(e){
    console.error('ONU save error:', e.message);
    // Fallback: save to localStorage
    try{ localStorage.setItem('brilha_onu', JSON.stringify(onuRegistros)); }catch(e2){}
    return false;
  }
}

// ── ONU ACTIONS ───────────────────────────────────────────────────────────────
function onuSearchCam(q){
  onuForm.camera = q;
  onuForm.cameraId = null;
  const dd = document.getElementById('onu-cam-dropdown');
  if(!dd) return;
  if(!q){ dd.innerHTML = CAMERAS.slice(0,8).map(camDropItem).join(''); return; }
  const ql = q.toLowerCase();
  const results = CAMERAS.filter(c=>c.name.toLowerCase().includes(ql)||c.address.toLowerCase().includes(ql)).slice(0,10);
  dd.style.display = results.length?'block':'none';
  dd.innerHTML = results.length
    ? results.map(camDropItem).join('')
    : '<div style="padding:10px 14px;color:var(--text-muted);font-size:12px">Nenhuma câmera encontrada</div>';
}
function camDropItem(c){
  return `<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(202,157,74,.05);font-size:13px"
    onclick="selectOnuCam(${c.id})"
    onmouseover="this.style.background='rgba(202,157,74,.08)'"
    onmouseout="this.style.background=''">
    <div style="font-weight:500">${c.name}</div>
    <div style="font-size:11px;color:var(--text-muted)">${c.address}</div>
  </div>`;
}
function selectOnuCam(id){
  const c = CAMERAS.find(x=>x.id===id);
  if(!c) return;
  onuForm.cameraId = c.id;
  onuForm.camera   = c.name;
  onuForm.cameraAddr = c.address;
  const dd = document.getElementById('onu-cam-dropdown');
  if(dd) dd.style.display='none';
  const inp = document.getElementById('onu-cam-search');
  if(inp) inp.value = c.name;
  onuMapMode = false;
  render();
}
function onuFindNearest(){
  if(!navigator.geolocation){ alert('GPS não disponível.'); return; }
  const msg = document.getElementById('onu-nearest-msg');
  if(msg){ msg.style.display='block'; msg.textContent='📍 Obtendo sua localização...'; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    let nearest=null, minDist=Infinity;
    CAMERAS.forEach(c=>{
      const d=Math.sqrt((c.lat-lat)**2+(c.lng-lng)**2);
      if(d<minDist){minDist=d;nearest=c;}
    });
    if(nearest){
      selectOnuCam(nearest.id);
      const dist=(minDist*111).toFixed(2);
      if(msg){ msg.textContent=`✓ Câmera mais próxima: ${nearest.name} (~${dist} km)`; }
    }
  },()=>{ if(msg){msg.textContent='❌ Não foi possível obter localização.';} });
}
function onuStep1Next(){
  if(!onuForm.cameraId){ alert('Selecione uma câmera.'); return; }
  onuFormStep=2; render();
}
function onuStep2Next(){
  onuForm.modeloOnu = document.getElementById('onu-modelo')?.value?.trim();
  onuForm.sn        = document.getElementById('onu-sn')?.value?.trim();
  onuForm.mac       = document.getElementById('onu-mac')?.value?.trim();
  onuForm.ponSn     = document.getElementById('onu-pon-sn')?.value?.trim();
  onuForm.pin       = document.getElementById('onu-pin')?.value?.trim();
  if(!onuForm.modeloOnu) return alert('Informe o modelo da ONU.');
  if(!onuForm.sn)        return alert('Informe o S/N.');
  if(!onuForm.mac)       return alert('Informe o MAC.');
  if(!onuForm.ponSn)     return alert('Informe o PON S/N.');
  onuFormStep=3; render();
}
function formatMac(el){
  let v=el.value.replace(/[^0-9A-Fa-f]/g,'').toUpperCase();
  if(v.length>12) v=v.slice(0,12);
  el.value=v.match(/.{1,2}/g)?.join(':')||v;
  onuForm.mac=el.value;
}
function onuFotoLoad(input, tipo){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    if(tipo==='antiga') onuForm.fotoAntiga=e.target.result;
    else onuForm.fotoNova=e.target.result;
    render();
  };
  r.readAsDataURL(file);
}
async function onuSubmit(){
  if(!onuForm.fotoNova) return alert('Foto da ONU nova é obrigatória.');
  const registro={
    id:'ONU-'+Date.now(),
    data: new Date().toISOString(),
    cameraId: onuForm.cameraId,
    camera:   onuForm.camera,
    cameraAddr: onuForm.cameraAddr,
    modeloOnu: onuForm.modeloOnu,
    sn:       onuForm.sn,
    mac:      onuForm.mac,
    ponSn:    onuForm.ponSn,
    pin:      onuForm.pin||'',
    fotoAntiga: onuForm.fotoAntiga||null,
    fotoNova:   onuForm.fotoNova,
    tecnico:    onuForm.tecnico,
    tecnicoId:  onuForm.tecnicoId,
  };
  onuRegistros.push(registro);
  showToast('💾 Salvando...');
  const saved = await saveOnuRegistro(registro);
  showToast(saved ? '✓ Troca ONU registrada e sincronizada!' : '⚠ Salvo localmente (sem conexão)');
  campoSubPage='troca-onu';
  render();
}
function exportOnuExcel(){
  if(!window.XLSX){ alert('Biblioteca Excel não carregada. Tente novamente.'); return; }
  if(!onuRegistros.length){ alert('Nenhum registro para exportar.'); return; }
  const rows = onuRegistros.map(r=>({
    'Data/Hora': r.data?new Date(r.data).toLocaleString('pt-BR'):'',
    'Câmera': r.camera||'',
    'Endereço': r.cameraAddr||'',
    'Modelo ONU': r.modeloOnu||'',
    'S/N': r.sn||'',
    'MAC': r.mac||'',
    'PON S/N': r.ponSn||'',
    'PIN': r.pin||'',
    'Técnico': r.tecnico||'',
    'Foto Antiga': r.fotoAntiga?'Sim':'Não',
    'Foto Nova': r.fotoNova?'Sim':'Não',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  // Column widths
  ws['!cols']=[{wch:18},{wch:16},{wch:30},{wch:18},{wch:18},{wch:18},{wch:18},{wch:10},{wch:18},{wch:10},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Trocas ONU');
  const date = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `trocas-onu-${date}.xlsx`);
  showToast('✓ Excel exportado!');
}
